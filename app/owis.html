<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU House Command</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// --- APP IDENTITY ---
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
const appIcon = isStudentApp ? 'https://trackedu.github.io/common-assets/studentapp.png' : 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#0f172a"; // Deep executive slate

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.href,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);
</script>

<style>
body, html { 
  margin: 0; padding: 0; height: 100%; overflow: hidden; 
  background-color: #f8fafc; font-family: 'Inter', sans-serif;
}

/* --- EXECUTIVE LOBBY SCREEN --- */
#welcomeScreen { 
  position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; 
  transition: opacity 0.6s ease, transform 0.6s ease; padding: 20px; text-align: center;
}

.executive-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 40px 35px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  display: flex; flex-direction: column; align-items: center;
  position: relative;
  overflow: hidden;
}

/* Subtle top accent line */
.executive-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, #10b981, #3b82f6);
}

.system-status {
  display: flex; align-items: center; gap: 8px;
  background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
  padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;
}

.status-dot {
  width: 8px; height: 8px; background: #10b981; border-radius: 50%;
  box-shadow: 0 0 8px #10b981;
}

.logo-img { 
  width: 90px; height: 90px; margin-bottom: 20px; 
  border-radius: 50%; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  border: 2px solid #f1f5f9;
}

.welcome-title {
  font-size: 26px; font-weight: 800; color: #0f172a; margin: 0 0 10px 0; letter-spacing: -0.5px;
}

.welcome-subtitle {
  font-size: 14px; color: #64748b; margin: 0 0 30px 0; font-weight: 500;
}

.ethos-box {
  background: #f8fafc; border: 1px solid #e2e8f0;
  padding: 20px; border-radius: 12px; margin-bottom: 30px;
  text-align: center; width: 100%; box-sizing: border-box;
}

.ethos-box p {
  color: #334155; font-size: 14px; margin: 0; line-height: 1.6; font-weight: 500; font-style: italic;
}

.btn-launch {
  background: #0f172a; color: white; border: none; border-radius: 12px;
  padding: 16px 24px; font-size: 16px; font-weight: 700;
  width: 100%; cursor: pointer;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
  transition: all 0.2s ease;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

.btn-launch:active {
  transform: translateY(2px); box-shadow: 0 2px 5px rgba(15, 23, 42, 0.3);
}

/* Loading State */
#loadingState {
  display: none; flex-direction: column; align-items: center; width: 100%;
}

.tip-container {
  width: 100%; min-height: 80px; margin-top: 20px;
  display: flex; align-items: center; justify-content: center;
  color: #334155; font-size: 14px; font-weight: 600; line-height: 1.5;
  transition: opacity 0.4s ease;
}

.spinner {
  width: 26px; height: 26px;
  border: 3px solid #e2e8f0; border-top-color: #3b82f6;
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

iframe { 
  position: fixed; inset: 0; width: 100%; height: 100%; border: none; 
  z-index: 1; background-color: #ffffff; opacity: 0; transition: opacity 0.4s ease; 
}
</style>
</head>

<body>

<div id="welcomeScreen">
  <div class="executive-card">
    <div class="system-status"><div class="status-dot"></div> Secure Connection</div>
    
    <img src="https://trackedu.github.io/common-assets/teacherapp.png" class="logo-img" alt="TrackEDU Logo">
    
    <div id="initialState" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <h1 class="welcome-title">House Command</h1>
      <p class="welcome-subtitle">Student Management & Culture Dashboard</p>
      
      <div class="ethos-box">
        <p>"Every point awarded is a behavior reinforced.<br>Welcome to the cultural heartbeat of your school."</p>
      </div>
      
      <button class="btn-launch" id="btnLaunch" onclick="handleLaunchClick()">
        Enter Portal <i class="fas fa-lock-open" style="font-size: 14px; opacity: 0.8;"></i>
      </button>
    </div>

    <div id="loadingState">
      <div class="spinner"></div>
      <p style="color: #0f172a; font-weight: 700; margin: 15px 0 5px 0;">Establishing Secure Link...</p>
      <div class="tip-container" id="tipText"></div>
    </div>

  </div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<script>
// --- 20 DYNAMIC PRO TIPS ---
const tips = [
  "💡 Tap the 'Magic Hat' in the Toolkit to pick random students for cold-calling.",
  "💡 Students who log in to the Student App 5 days in a row earn a streak reward.",
  "💡 Create a 'Secret Code' in Loot Drops and hide it on the whiteboard for early finishers.",
  "💡 Use Duo Mode to show a countdown timer and pick random students at the same time.",
  "💡 Every milestone a student hits unlocks a holographic collectible card in their binder.",
  "💡 You can award points to an entire class at once using the 'Award House Points' button.",
  "💡 Need to undo a mistake? Check the 'Award History' tab to reverse any transaction.",
  "💡 Tap a student's avatar icon in the list to instantly give them +1 point.",
  "💡 Long-press a student's avatar icon to instantly remove 1 point.",
  "💡 Use the 'Squad Builder' to instantly generate randomized groups for projects.",
  "💡 Launch a 'Voice Poll' to let students vote on school themes. Voting earns them +1 point!",
  "💡 Set custom Point Reasons in Settings so your teachers don't have to type them out.",
  "💡 The Top 3 Contributing Classes get special highlights on the main dashboard.",
  "💡 Print the 'Engagement Posters' so students can easily scan the QR code to log in.",
  "💡 The 'Mystery Word' mission forces students from different classes to collaborate.",
  "💡 Check the 'House of Fortune' wheel to give out a daily lucky draw point.",
  "💡 'Remember Me' on the login screen keeps you signed in for 30 days.",
  "💡 Tapping the 'Select' button lets you choose specific students for a bulk point drop.",
  "💡 Ants are the ultimate team players. Encourage your house to work together today!",
  "💡 A student's rank badge automatically upgrades as they earn more points."
];

let tipInterval;
let appReady = false; 
let userWaiting = false; 

function startTipCarousel() {
  const tipTextEl = document.getElementById('tipText');
  let currentTipIndex = Math.floor(Math.random() * tips.length);
  tipTextEl.innerHTML = tips[currentTipIndex];

  tipInterval = setInterval(() => {
    tipTextEl.style.opacity = '0'; 
    setTimeout(() => {
      currentTipIndex = (currentTipIndex + 1) % tips.length;
      tipTextEl.innerHTML = tips[currentTipIndex];
      tipTextEl.style.opacity = '1'; 
    }, 400);
  }, 4000);
}


// --- THE "GHOST LOAD" ENGINE ---
const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec";
const CACHE_KEY = `trackedu_license_${schoolId}`;

// 1. Give the beautiful UI 800ms to render flawlessly, then start heavy lifting in the background
window.addEventListener('load', () => {
  setTimeout(() => {
    initiateGatekeeperBackground();
  }, 800); 
});

function getSavedLicense() {
  let data = localStorage.getItem(CACHE_KEY);
  if (!data) {
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(CACHE_KEY + "=")) {
        data = decodeURIComponent(c.substring(CACHE_KEY.length + 1));
        break;
      }
    }
  }
  return data;
}

function saveLicense(dataObj) {
  const dataStr = JSON.stringify({ timestamp: new Date().getTime(), data: dataObj });
  localStorage.setItem(CACHE_KEY, dataStr);
  const expiry = new Date(new Date().getTime() + 86400000).toUTCString(); 
  document.cookie = `${CACHE_KEY}=${encodeURIComponent(dataStr)};expires=${expiry};path=/;SameSite=None;Secure`;
}

function initiateGatekeeperBackground() {
  const cachedLicenseStr = getSavedLicense();
  let useCache = false;

  if (cachedLicenseStr) {
    try {
      const parsedData = JSON.parse(cachedLicenseStr);
      const now = new Date().getTime();
      if (now - parsedData.timestamp < 600000) { 
        useCache = true;
        loadIframeSilently(parsedData.data);
      }
    } catch (e) { 
      localStorage.removeItem(CACHE_KEY);
    }
  }

  if (!useCache) {
    fetch(`${GATEKEEPER_URL}?id=${schoolId}&cb=${new Date().getTime()}`, { cache: 'no-store', priority: 'high' })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          saveLicense(data);
          loadIframeSilently(data);
        } else {
          showHardLock(data.reason);
        }
      })
      .catch(error => {
        showHardLock("Unable to reach the security server. Please check your internet connection.");
      });
  }
}

function loadIframeSilently(data) {
  let finalUrl = data.url;
  if (data.expiry) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "expiry=" + encodeURIComponent(data.expiry);
  if (data.tier) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "tier=" + encodeURIComponent(data.tier);
  if (typeof isStudentApp !== 'undefined' && isStudentApp) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "view=house-students";

  const frame = document.getElementById('appFrame');
  frame.src = finalUrl;

  let loadCount = 0;
  frame.onload = () => {
    loadCount++;
    if (loadCount >= 2) {
      appReady = true;
      if (userWaiting) revealApp(); // If user already clicked, let them in instantly
    }
  };
}

// --- USER INTERACTION LOGIC ---
function handleLaunchClick() {
  if (appReady) {
    // Holy Grail: They read the ethos, clicked the button, and it's already done loading.
    revealApp();
  } else {
    // They clicked fast. Show them the tips while we wait for the background load to finish.
    userWaiting = true;
    document.getElementById('initialState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'flex';
    startTipCarousel();

    // Force reveal after 8 seconds of waiting just in case Google misses the 'onload' event
    setTimeout(revealApp, 8000);
  }
}

function revealApp() {
  clearInterval(tipInterval);
  const loader = document.getElementById('welcomeScreen');
  const frame = document.getElementById('appFrame');
  
  if (loader && loader.style.display !== 'none') {
    frame.style.opacity = '1';
    loader.style.transform = 'scale(1.05)'; // Elegant zoom out effect
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 600);
  }
}

function showHardLock(reason) {
  clearInterval(tipInterval);
  document.getElementById('welcomeScreen').innerHTML = `
    <div class="executive-card" style="border-top: 6px solid #ef4444;">
      <div style="width: 70px; height: 70px; border-radius: 50%; background: #fee2e2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px;">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="welcome-title" style="color: #b91c1c;">Access Restricted</h1>
      <p style="font-size: 15px; color: #475569; margin-bottom: 30px; line-height: 1.5;">${reason}</p>
      
      <div style="display: flex; gap: 10px; width: 100%;">
        <button onclick="window.location.reload()" style="flex: 1; padding: 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; font-weight: 700; color: #475569; cursor: pointer;">Retry</button>
        <a href="mailto:hello@trackedu.net" style="flex: 1; padding: 14px; background: #0f172a; color: white; text-decoration: none; border-radius: 12px; font-weight: 700; cursor: pointer;">Support</a>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
