<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU Digital House Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// --- PWA MANIFEST ---
const appName = "TrackEDU";
const appIcon = 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#f8fafc"; 

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.href,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);
</script>

<style>
body, html { 
  margin: 0; padding: 0; height: 100%; overflow: hidden; 
  background-color: #f8fafc; font-family: 'Inter', sans-serif;
}

/* --- THE WELCOME SCREEN --- */
#welcomeScreen { 
  position: fixed; inset: 0; background: #f8fafc; z-index: 9999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
  transition: opacity 0.5s ease; padding: 20px; text-align: center;
}

.welcome-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 24px;
  padding: 40px 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  display: flex; flex-direction: column; align-items: center;
}

.logo-img { 
  width: 120px; height: 120px; margin-bottom: 20px; 
  border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.welcome-title {
  font-size: 24px; font-weight: 800; color: #1e293b; margin: 0 0 10px 0;
}

.welcome-subtitle {
  font-size: 15px; color: #64748b; margin: 0 0 30px 0; line-height: 1.5;
}

.btn-launch {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white; border: none; border-radius: 14px;
  padding: 16px 24px; font-size: 18px; font-weight: 700;
  width: 100%; cursor: pointer;
  box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

.btn-launch:active {
  transform: translateY(2px); box-shadow: 0 2px 5px rgba(59, 130, 246, 0.3);
}

#loadingState {
  display: none; flex-direction: column; align-items: center; gap: 15px;
}

.spinner {
  width: 30px; height: 30px;
  border: 4px solid #e2e8f0; border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

iframe { 
  position: fixed; inset: 0; width: 100%; height: 100%; border: none; 
  z-index: 1; background-color: #ffffff; opacity: 0; transition: opacity 0.4s ease; 
}
</style>
</head>

<body>

<div id="welcomeScreen">
  <div class="welcome-card">
    <img src="https://trackedu.github.io/common-assets/teacherapp.png" class="logo-img" alt="TrackEDU Logo">
    
    <div id="initialState">
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Ready to award some points and engage your classroom?</p>
      
      <button class="btn-launch" onclick="launchApp()">
        Launch Dashboard <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <div id="loadingState">
      <div class="spinner"></div>
      <p style="color: #3b82f6; font-weight: 700; margin: 0;">Connecting securely...</p>
      <p style="color: #64748b; font-size: 13px; margin: 5px 0 0 0;">This may take a few seconds.</p>
    </div>

  </div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<script>
const DIRECT_APP_URL = "https://script.google.com/a/globalschools.com/macros/s/AKfycbzOB8CReA-ZPz8LkkKc-GERQCcAXXD4Q1qfjTDFhibD27FGeGfqWsdVdI2x6E2LkutRxQ/exec?id=owis&tier=Global%20Schools%20Tier&expiry=2099-12-31"; 

function launchApp() {
  document.getElementById('initialState').style.display = 'none';
  document.getElementById('loadingState').style.display = 'flex';

  setTimeout(() => {
    const frame = document.getElementById('appFrame');
    frame.src = DIRECT_APP_URL;

    // We count onloads because Google Apps Script does a sneaky "302 Redirect"
    // The first onload is often a blank white page, the second is the real tool.
    let loadCount = 0;
    
    frame.onload = () => {
      loadCount++;
      // Reveal the app if it loaded twice (redirect finished) OR if it's been at least 4 seconds
      if (loadCount >= 2) {
        revealApp();
      }
    };

    // Backup reveal: Force reveal after 6 seconds of spinning no matter what.
    // This entirely hides the white screen phase.
    setTimeout(revealApp, 6000);

  }, 100); 

  // THE FIX: Failsafe is now safely INSIDE the function, starting ONLY when the button is clicked.
  setTimeout(() => {
    revealApp();
  }, 15000);
}

function revealApp() {
  const loader = document.getElementById('welcomeScreen');
  const frame = document.getElementById('appFrame');
  
  if (loader && loader.style.display !== 'none') {
    frame.style.opacity = '1';
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
  }
}
</script>
</body>
</html>
