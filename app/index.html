<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU House Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// --- APP IDENTITY & PARAMS ---
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
const appIcon = isStudentApp ? 'https://trackedu.github.io/common-assets/studentapp.png' : 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#ffffff";

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.origin + window.location.pathname + window.location.search,
  display: "standalone",
  background_color: "#ffffff",
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
  setTimeout(() => {
    navigator.serviceWorker.register('/sw.js');
  }, 2000);
}
</script>

<style>
:root {
  --brand-primary: #1e40af;
  --brand-success: #10b981;
  --bg-soft: #f8fafc;
}

body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background-color: #ffffff;
  font-family: 'Inter', sans-serif;
}

#welcomeScreen {
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  will-change: clip-path, opacity;
  contain: strict;
  transition: clip-path 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.4s ease;
}

#welcomeScreen.expanding {
  clip-path: circle(0% at 50% 50%);
  opacity: 0;
  pointer-events: none;
}

.executive-card {
  background: #ffffff;
  border-radius: 28px;
  padding: 45px 35px;
  width: 100%;
  max-width: 460px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow: hidden;
  border: 1px solid #f1f5f9;
}

.executive-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: var(--brand-primary);
}

.system-status {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #166534;
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 25px;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: var(--brand-success);
  border-radius: 50%;
  animation: pulse-glow 2s infinite;
}

@keyframes pulse-glow {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.logo-img {
  width: 80px;
  height: 80px;
  margin-bottom: 20px;
  border-radius: 50%;
  border: 1px solid #f1f5f9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.welcome-title {
  font-size: 24px;
  font-weight: 800;
  color: #0f172a;
  margin: 0 0 8px 0;
}

.ethos-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 22px;
  border-radius: 14px;
  margin-bottom: 30px;
  width: 100%;
  box-sizing: border-box;
}

.ethos-box p {
  color: #334155;
  font-size: 14px;
  margin: 0;
  line-height: 1.6;
  font-weight: 500;
  font-style: italic;
}

.btn-launch {
  background: var(--brand-primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 18px 24px;
  font-size: 16px;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  transition: all 0.2s ease;
}

.btn-launch:active {
  transform: scale(0.98);
  opacity: 0.9;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  z-index: 1;
  background-color: #ffffff;
  opacity: 0;
  transition: opacity 0.5s ease;
  -webkit-overflow-scrolling: touch;
}
</style>
</head>

<body>
<div id="welcomeScreen">
  <div class="executive-card">
    <div class="system-status">
      <div class="status-dot"></div> School Connection Active
    </div>

    <img id="welcomeLogo" src="" class="logo-img" alt="TrackEDU Logo" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'">

    <h1 class="welcome-title">House Points Portal</h1>

    <div class="ethos-box">
      <p id="ethosText">Connecting to your House system...</p>
    </div>

    <button class="btn-launch" id="btnLaunch" onclick="handleLaunchClick()"></button>
  </div>
</div>

<iframe id="appFrame" allow="fullscreen" fetchpriority="high"></iframe>

<script>
// Theme logic
const root = document.documentElement;
const launchBtn = document.getElementById('btnLaunch');
const welcomeLogo = document.getElementById('welcomeLogo');

if (isStudentApp) {
  root.style.setProperty('--brand-primary', '#10b981');
  document.title = "TrackEDU | Student Portal";
  welcomeLogo.src = "https://trackedu.github.io/common-assets/studentapp.png";
  if (launchBtn) launchBtn.innerHTML = 'View My Hero <i class="fas fa-mask" style="margin-left:8px;"></i>';
} else {
  root.style.setProperty('--brand-primary', '#1e40af');
  document.title = "TrackEDU | Teacher Admin";
  welcomeLogo.src = "https://trackedu.github.io/common-assets/teacherapp.png";
  if (launchBtn) launchBtn.innerHTML = 'Go to Class <i class="fas fa-chalkboard-teacher" style="margin-left:8px;"></i>';
}

function handleLaunchClick() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('appFrame').style.opacity = '1';
}
</script>
</body>
</html>
