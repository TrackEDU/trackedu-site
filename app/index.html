<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU House Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://trackedu.github.io">

<script>
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

// --- APP IDENTITY ---
// Check if running as an installed PWA
const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

// Use a clean brand name for the PWA window bar, but keep specific titles for browser tabs
const appName = isPWA ? "TrackEDU" : (isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher");

document.title = appName;

const appIcon = isStudentApp
? 'https://trackedu.github.io/common-assets/studentapp.png'
: 'https://trackedu.github.io/common-assets/teacherapp.png';

const themeColor = "#ffffff";
const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: isStudentApp 
    ? window.location.origin + window.location.pathname + `?id=${schoolId}&view=public` 
    : window.location.origin + window.location.pathname + `?id=${schoolId}`,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER (IPAD OPTIMIZED: ASYNCHRONOUS LOAD) ---
if ('serviceWorker' in navigator) {
  // We delay registration by 2 seconds to ensure the iframe gets 100% bandwidth first
  setTimeout(() => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            document.getElementById('updateToast').style.display = 'block';
          }
        });
      });
    });
  }, 2000);
}
</script>

<style>
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
#loadingScreen { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
.loading-logo-img { width: 300px; height: auto; margin-bottom: 15px; animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; background-color: #ffffff; }
#installBtn { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: #fbbf24; color: #020617; border: none; padding: 12px 24px; border-radius: 25px; font-weight: 700; z-index: 10000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
#updateToast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 20px; border-radius: 50px; font-family: sans-serif; font-weight: 700; z-index: 10001; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideDown 0.5s ease; }
@keyframes slideDown { from { top: -60px; } to { top: 20px; } }
</style>
</head>

<body>
<div id="updateToast" onclick="window.location.reload()">✨ Update available — tap to refresh</div>
<div id="loadingScreen"><img src="https://trackedu.github.io/common-assets/tsloading.png" class="loading-logo-img" alt="TrackEDU Logo"></div>
<iframe id="appFrame" allow="fullscreen"></iframe>
<button id="installBtn">📲 Install TrackEDU</button>

<script>
const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec";
const CACHE_KEY = `trackedu_license_${schoolId}`;

function getSavedLicense() {
  let data = localStorage.getItem(CACHE_KEY);
  if (!data) {
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(CACHE_KEY + "=")) {
        data = decodeURIComponent(c.substring(CACHE_KEY.length + 1));
        break;
      }
    }
  }
  return data;
}

function saveLicense(dataObj) {
  const dataStr = JSON.stringify({ timestamp: new Date().getTime(), data: dataObj });
  localStorage.setItem(CACHE_KEY, dataStr);
  const expiry = new Date(new Date().getTime() + 86400000).toUTCString(); 
  document.cookie = `${CACHE_KEY}=${encodeURIComponent(dataStr)};expires=${expiry};path=/;SameSite=None;Secure`;
}

function launchIframe(data) {
  let finalUrl = data.url;
  if (data.expiry) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "expiry=" + encodeURIComponent(data.expiry);
  if (data.tier) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "tier=" + encodeURIComponent(data.tier);
  if (typeof isStudentApp !== 'undefined' && isStudentApp) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "view=house-students";

  const frame = document.getElementById('appFrame');
  frame.src = finalUrl;
  
  frame.onload = () => {
    const loader = document.getElementById('loadingScreen');
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 300);
  };
  
  setTimeout(() => {
    const loader = document.getElementById('loadingScreen');
    if (loader && loader.style.display !== 'none') {
       loader.style.opacity = '0';
       setTimeout(() => loader.style.display = 'none', 300);
    }
  }, 5000);
}

/**
 * 🛡️ SECURITY UPDATE: showHardLock now performs a "Clean Kill"
 * It wipes the local session memory so the device cannot auto-resume.
 */
function showHardLock(reason) {
  // 1. Wipe local data immediately
  localStorage.removeItem(CACHE_KEY);
  document.cookie = `${CACHE_KEY}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
  
  // 2. Render the Lock Screen with a Red "Restricted" theme
  document.getElementById('loadingScreen').innerHTML = `
    <div style="background-color: #ffffff; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; padding: 40px; box-sizing: border-box; text-align: center;">
      <div style="width: 150px; height: 150px; border-radius: 50%; background: #ffffff; border: 4px solid #ef4444; display: flex; align-items: center; justify-content: center; margin-bottom: 35px; box-shadow: 0 12px 30px -10px rgba(239, 68, 68, 0.3); overflow: hidden;">
        <img src="https://trackedu.github.io/common-assets/tsloading.png" style="width: 130px; height: 130px; object-fit: contain;" alt="TrackEDU Logo">
      </div>
      <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 15px; color: #b91c1c;">Access Restricted</h1>
      <p style="font-size: 18px; color: #4b5563; max-width: 480px; margin-bottom: 35px; line-height: 1.5;">
        ${reason || "Your school's access has been deactivated. Please contact your administrator."}
      </p>
      <div style="display: flex; gap: 15px;">
        <a href="mailto:hello@trackedu.net" style="text-decoration: none; background: #1e293b; color: #ffffff; padding: 16px 45px; border-radius: 60px; font-weight: 700; transition: all 0.2s ease;">
          Support
        </a>
        <button onclick="window.location.reload()" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 16px 35px; border-radius: 60px; font-weight: 700; cursor: pointer;">
          Retry
        </button>
      </div>
    </div>
  `;
}

// --- MAIN EXECUTION FLOW ---

const cachedLicenseStr = getSavedLicense();
let useCache = false;

if (cachedLicenseStr) {
  try {
    const parsedData = JSON.parse(cachedLicenseStr);
    const now = new Date().getTime();
    
    // 🛡️ SECURITY UPDATE: Cache reduced to 10 minutes (600,000 ms)
    // This ensures inactive licenses are caught quickly while keeping the app fast.
    if (now - parsedData.timestamp < 600000) {
      useCache = true;
      console.log("🛡️ License verified via 10-min soft-cache.");
      launchIframe(parsedData.data);
    }
  } catch (e) { 
    console.warn("Cache parse error, clearing session."); 
    localStorage.removeItem(CACHE_KEY);
  }
}

if (!useCache) {
  // ⚡ CACHE BUSTER FIX: cb parameter prevents MacBook browsers from using old cached responses
  fetch(`${GATEKEEPER_URL}?id=${schoolId}&cb=${new Date().getTime()}`, { 
    cache: 'no-store', 
    priority: 'high' 
  })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        saveLicense(data);
        launchIframe(data);
      } else {
        // This will now wipe the MacBook's local session
        showHardLock(data.reason);
      }
    })
    .catch(error => {
      document.getElementById('loadingScreen').innerHTML = `
        <div style="background-color: #ffffff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
          <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 15px;">Connection Error</h2>
          <p style="margin-bottom: 20px; color: #666;">Unable to reach the security gatekeeper.</p>
          <button onclick="window.location.reload()" style="background: #10b981; color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 700; cursor: pointer;">Try Again</button>
        </div>
      `;
    });
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') document.getElementById('installBtn').style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
