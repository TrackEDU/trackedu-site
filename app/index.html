<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU House Point System for Schools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// --- APP IDENTITY & PARAMS ---
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
const appIcon = isStudentApp ? 'https://trackedu.github.io/common-assets/studentapp.png' : 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#0f172a"; 

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.origin + window.location.pathname + window.location.search,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
  setTimeout(() => {
    navigator.serviceWorker.register('/sw.js');
  }, 2000);
}
</script>

<style>
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }

/* --- EXECUTIVE LOBBY SCREEN --- */
#welcomeScreen { 
  position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; 
  transition: opacity 0.6s ease, transform 0.6s ease; padding: 20px; text-align: center;
}

.executive-card {
  background: #ffffff; border-radius: 20px; padding: 40px 35px; width: 100%; max-width: 480px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
}

.executive-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, #10b981, #3b82f6);
}

.system-status {
  display: flex; align-items: center; gap: 8px; background: #f0fdf4; border: 1px solid #bbf7d0; 
  color: #166534; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;
}

.status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

.logo-img { width: 90px; height: 90px; margin-bottom: 20px; border-radius: 50%; border: 2px solid #f1f5f9; }

.welcome-title { font-size: 26px; font-weight: 800; color: #0f172a; margin: 0 0 10px 0; }

.ethos-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
.ethos-box p { color: #334155; font-size: 14px; margin: 0; line-height: 1.6; font-weight: 500; font-style: italic; }

.btn-launch {
  background: #0f172a; color: white; border: none; border-radius: 12px; padding: 16px 24px; font-size: 16px;
  font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
}

#loadingState { display: none; flex-direction: column; align-items: center; width: 100%; }
.tip-container { width: 100%; min-height: 80px; margin-top: 20px; display: flex; align-items: center; justify-content: center; color: #334155; font-size: 14px; font-weight: 600; line-height: 1.5; transition: opacity 0.4s ease; }
.spinner { width: 26px; height: 26px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; background-color: #ffffff; opacity: 0; transition: opacity 0.4s ease; }
</style>
</head>

<body>
<div id="welcomeScreen">
  <div class="executive-card">
    <div class="system-status"><div class="status-dot"></div> Secure Connection</div>
    <img src="https://trackedu.github.io/common-assets/tsloading.png" class="logo-img" alt="TrackEDU Logo">
    
    <div id="initialState" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <h1 class="welcome-title">House Points</h1>
      <div class="ethos-box">
        <p>"Every point awarded is a behavior reinforced.<br>Welcome to the cultural heartbeat of your school."</p>
      </div>
      <button class="btn-launch" id="btnLaunch" onclick="handleLaunchClick()">Enter Portal <i class="fas fa-lock-open"></i></button>
    </div>

    <div id="loadingState">
      <div class="spinner"></div>
      <p style="color: #0f172a; font-weight: 700; margin: 15px 0 5px 0;">Establishing Secure Link...</p>
      <div class="tip-container" id="tipText"></div>
    </div>
  </div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<script>
const tips = [
  "💡 Tap the 'Magic Hat' in the Toolkit to pick random students.",
  "💡 Create a 'Secret Code' in Loot Drops for early finishers.",
  "💡 Every milestone a student hits unlocks a card in their binder.",
  "💡 Tap a student's avatar icon in the list to give them +1 point.",
  "💡 Use Duo Mode to show a timer and pick students at the same time."
];

let tipInterval;
let appReady = false; 
let userWaiting = false; 

function startTipCarousel() {
  const tipTextEl = document.getElementById('tipText');
  let currentTipIndex = Math.floor(Math.random() * tips.length);
  tipTextEl.innerHTML = tips[currentTipIndex];
  tipInterval = setInterval(() => {
    tipTextEl.style.opacity = '0'; 
    setTimeout(() => {
      currentTipIndex = (currentTipIndex + 1) % tips.length;
      tipTextEl.innerHTML = tips[currentTipIndex];
      tipTextEl.style.opacity = '1'; 
    }, 400);
  }, 4000);
}

// --- GHOST LOAD ENGINE ---
const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec";
const CACHE_KEY = `trackedu_license_${schoolId}`;

window.addEventListener('load', () => { setTimeout(initiateGatekeeperBackground, 800); });

function initiateGatekeeperBackground() {
  fetch(`${GATEKEEPER_URL}?id=${schoolId}&cb=${new Date().getTime()}`, { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (data.success) loadIframeSilently(data);
      else showHardLock(data.reason);
    }).catch(() => showHardLock("Connection Error. Check internet."));
}

function loadIframeSilently(data) {
  let url = data.url;
  url += (url.includes('?') ? '&' : '?') + "expiry=" + encodeURIComponent(data.expiry) + "&tier=" + encodeURIComponent(data.tier);
  if (isStudentApp) url += "&view=house-students";

  const frame = document.getElementById('appFrame');
  frame.src = url;
  let count = 0;
  frame.onload = () => { if (++count >= 2) { appReady = true; if (userWaiting) revealApp(); }};
}

function handleLaunchClick() {
  if (appReady) revealApp();
  else {
    userWaiting = true;
    document.getElementById('initialState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'flex';
    startTipCarousel();
    setTimeout(revealApp, 8000);
  }
}

function revealApp() {
  clearInterval(tipInterval);
  const loader = document.getElementById('welcomeScreen');
  const frame = document.getElementById('appFrame');
  if (loader && loader.style.display !== 'none') {
    frame.style.opacity = '1';
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 600);
  }
}

function showHardLock(reason) {
  document.getElementById('welcomeScreen').innerHTML = `
    <div class="executive-card" style="border-top: 6px solid #ef4444;">
      <h1 class="welcome-title" style="color:#b91c1c;">Access Restricted</h1>
      <p>${reason}</p>
      <button onclick="window.location.reload()" class="btn-launch">Retry</button>
    </div>`;
}
</script>
</body>
</html>
