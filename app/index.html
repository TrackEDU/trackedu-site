<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrackEDU | Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="preconnect" href="https://script.google.com">
  
  <script>
    const params = new URLSearchParams(window.location.search);
    const schoolId = params.get('id') || 'demo'; 
    const isPublic = params.get('view') === 'public';
    
    // --- 1. SET BRANDING BASED ON ROLE ---
    // Make sure you upload your new square icons with these exact names
    const appIcon = isPublic 
      ? '/studentapp.png'   // The new "House Arena" star icon
      : '/teacherapp.png';  // The new "House Control" shield icon

    const appName = isPublic ? "TrackEDU Student" : "TrackEDU Teacher";
    const shortName = isPublic ? "Student" : "Teacher";
    const themeColor = isPublic ? "#020617" : "#1e40af";
    const bgColor = isPublic ? "#020617" : "#ffffff";

    // --- 2. GENERATE DYNAMIC MANIFEST ---
    const baseManifest = {
      "name": appName,
      "short_name": shortName,
      "start_url": isPublic ? `/app/?id=${schoolId}&view=public` : `/app/?id=${schoolId}`,
      "display": "fullscreen",
      "background_color": bgColor,
      "theme_color": themeColor,
      "orientation": "portrait",
      "icons": [
        { "src": appIcon, "sizes": "192x192", "type": "image/png", "purpose": "any" },
        { "src": appIcon, "sizes": "512x512", "type": "image/png", "purpose": "any" }
      ]
    };

    const blob = new Blob([JSON.stringify(baseManifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              document.getElementById('updateToast').style.display = 'block';
            }
          });
        });
      });
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #020617; }
    #loadingScreen {
      position: fixed; inset: 0; background: #020617; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
      border-top: 5px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; opacity: 0; transition: opacity 0.5s; }
    
    .loading-text {
      margin-top: 25px; font-family: 'Poppins', sans-serif;
      font-size: 18px; font-weight: 600; text-align: center;
    }
    .text-white { color: #ffffff; }
    .text-green { color: #22c55e; }
    .text-gray { color: #94a3b8; font-weight: 400; font-size: 14px; display: block; margin-top: 5px; }

    #installBtn {
      display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background-color: #fbbf24; color: #020617; border: none; padding: 12px 24px;
      border-radius: 25px; font-weight: bold; z-index: 10000; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #updateToast {
      display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #22c55e; color: white; padding: 12px 20px; border-radius: 50px;
      font-family: sans-serif; font-weight: bold; z-index: 10001; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideDown 0.5s ease;
    }
    @keyframes slideDown { from { top: -60px; } to { top: 20px; } }
  </style>
</head>
<body>

  <div id="updateToast" onclick="window.location.reload()">✨ Update Available! Click to Refresh</div>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div id="statusText" class="loading-text"></div>
  </div>

  <iframe id="appFrame" allow="fullscreen"></iframe>
  <button id="installBtn">🏆 Install App</button>

  <script>
    // --- DISPLAY LOADING TEXT ---
    const statusDiv = document.getElementById('statusText');
    // Shows "TrackEDU Student" or "TrackEDU Teacher" in green/white
    statusDiv.innerHTML = isPublic 
      ? '<span class="text-white">Loading... </span><br><span class="text-white">Track</span><span class="text-green">EDU</span> <span class="text-gray">Student</span>' 
      : '<span class="text-white">Loading... </span><br><span class="text-white">Track</span><span class="text-green">EDU</span> <span class="text-gray">Teacher</span>';

    // --- SCHOOL REGISTRY ---
    const schoolRegistry = {
      "demo": "https://script.google.com/a/macros/globalschools.com/s/AKfycbwz5xOd2n-YR7tzQ0NCvXEBSwaQzErW0-e6PZHZIP1hLByl1qUM6G2EKi192Iyqs6bG/exec",
      "bis": "",
      "owis": ""
    };

    if (schoolId && schoolRegistry[schoolId]) {
      let finalUrl = schoolRegistry[schoolId];
      if (isPublic) {
         finalUrl += (finalUrl.includes('?') ? '&' : '?') + "view=house-students";
      }
      
      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;
      frame.onload = function() {
         document.getElementById('loadingScreen').style.opacity = '0';
         frame.style.opacity = '1';
         setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; }, 500);
      };
    } else {
      document.getElementById('loadingScreen').innerHTML = `
        <div style="text-align:center;">
          <h2 style="color:white; font-family:sans-serif;">School Not Found</h2>
          <p style="color:#94a3b8; font-family:sans-serif;">Check the link or contact your administrator.</p>
        </div>`;
    }

    // --- INSTALL BUTTON LOGIC ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') document.getElementById('installBtn').style.display = 'none';
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
