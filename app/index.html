<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU House Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// --- APP IDENTITY & PARAMS ---
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
const appIcon = isStudentApp ? 'https://trackedu.github.io/common-assets/studentapp.png' : 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#ffffff";

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.origin + window.location.pathname + window.location.search,
  display: "standalone",
  background_color: "#ffffff",
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
  setTimeout(() => {
    navigator.serviceWorker.register('/sw.js');
  }, 2000);
}
</script>

<style>
:root {
  --brand-primary: #1e40af; 
  --brand-success: #10b981;
  --bg-soft: #f8fafc;
}

body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Inter', sans-serif; }

#welcomeScreen {
  position: fixed; inset: 0; background: #ffffff;
  z-index: 9999; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px; text-align: center;
  will-change: clip-path, opacity;
  contain: strict;
  transition: clip-path 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.4s ease;
}

#welcomeScreen.expanding {
  -webkit-clip-path: circle(0% at 50% 50%); /* ⚡ FIX: Added webkit for iOS Safari */
  clip-path: circle(0% at 50% 50%);
  opacity: 0;
  pointer-events: none;
}

.executive-card {
  background: #ffffff; border-radius: 28px; padding: 45px 35px; width: 100%; max-width: 460px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden; border: 1px solid #f1f5f9;
}

.executive-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--brand-primary); }

.system-status {
  display: flex; align-items: center; gap: 8px; background: #f0fdf4; border: 1px solid #bbf7d0;
  color: #166534; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;
}

.status-dot { width: 8px; height: 8px; background: var(--brand-success); border-radius: 50%; animation: pulse-glow 2s infinite; }

@keyframes pulse-glow {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.logo-img { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 50%; border: 1px solid #f1f5f9; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

.welcome-title { font-size: 24px; font-weight: 800; color: #0f172a; margin: 0 0 8px 0; }

.ethos-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 22px; border-radius: 14px; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
.ethos-box p { color: #334155; font-size: 14px; margin: 0; line-height: 1.6; font-weight: 500; font-style: italic; }

.btn-launch {
  background: var(--brand-primary); color: white; border: none; border-radius: 14px; padding: 18px 24px; font-size: 16px;
  font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transition: all 0.2s ease;
}
.btn-launch:active { transform: scale(0.96); opacity: 0.9; }

#loadingState { display: none; flex-direction: column; align-items: center; width: 100%; }
.tip-container { width: 100%; min-height: 80px; margin-top: 20px; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 14px; font-weight: 600; line-height: 1.5; transition: opacity 0.4s ease; }
.spinner { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-top-color: var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton-container { width: 100%; margin-top: 20px; display: none; flex-direction: column; gap: 12px; }
#loadingState.flex .skeleton-container { display: flex; }

.skeleton-bar { height: 18px; background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 6px; }
@keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; background-color: #ffffff; 
  opacity: 0.01; /* ⚡ FIX: 0.01 forces iOS Safari to render and load the iframe in the background */
  transition: opacity 0.5s ease;
  -webkit-overflow-scrolling: touch; 
}
</style>
</head>

<body>
<div id="welcomeScreen">
  <div class="executive-card">
    <div class="system-status"><div class="status-dot"></div> School Connection Active</div>
    <img id="welcomeLogo" src="" class="logo-img" alt="TrackEDU Logo" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'">
    
    <div id="initialState" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <h1 class="welcome-title">House Points Portal</h1>
      <div class="ethos-box"><p id="ethosText">Connecting to your House system...</p></div>
      <button type="button" class="btn-launch" id="btnLaunch" onclick="handleLaunchClick()"></button>
    </div>

    <div id="loadingState">
      <div class="spinner"></div>
      <p style="color: #0f172a; font-weight: 700; margin: 15px 0 5px 0; font-size: 13px;">Syncing with School Server...</p>
      <div class="skeleton-container">
        <div class="skeleton-bar" style="width: 80%;"></div>
        <div class="skeleton-bar" style="width: 100%;"></div>
        <div class="skeleton-bar" style="width: 60%;"></div>
      </div>
      <div class="tip-container" id="tipText"></div>
    </div>
  </div>
</div>

<iframe id="appFrame" allow="fullscreen" fetchpriority="high"></iframe>

<script>
// ⚡ ADAPTIVE THEME LOGIC
const root = document.documentElement;
const launchBtn = document.getElementById('btnLaunch');
const welcomeLogo = document.getElementById('welcomeLogo');

if (isStudentApp) {
  root.style.setProperty('--brand-primary', '#10b981');
  document.title = "TrackEDU | Student Portal";
  welcomeLogo.src = "https://trackedu.github.io/common-assets/studentapp.png";
  // Updated text to "Open Student App"
  if (launchBtn) launchBtn.innerHTML = 'Open Student App <i class="fas fa-user-graduate" style="margin-left:8px;"></i>';
} else {
  root.style.setProperty('--brand-primary', '#1e40af');
  document.title = "TrackEDU | Teacher Admin";
  welcomeLogo.src = "https://trackedu.github.io/common-assets/teacherapp.png";
  // Updated text to "Open Teacher App"
  if (launchBtn) launchBtn.innerHTML = 'Open Teacher App <i class="fas fa-chalkboard-teacher" style="margin-left:8px;"></i>';
}

const ethosStatements = [
  "The Ant was chosen because a single worker is small, but a colony is an unstoppable force of nature.",
  "Every House Point awarded is a positive behavior reinforced. You are building school culture.",
  "Teamwork is the silent language of the colony. One goal, many hands, infinite impact."
];

const tips = [
  "💡 High-performing schools are built on consistent recognition, not just high points.",
  "💡 Use the 'Magic Hat' in the Toolkit to ensure every student has a fair chance to participate.",
  "💡 Students who maintain a 5-day login streak earn automated resilience bonuses."
];

let tipInterval;
let appReady = false;
let userWaiting = false;
let authFailed = false; 

document.getElementById('ethosText').innerText = ethosStatements[Math.floor(Math.random() * ethosStatements.length)];

function startTipCarousel() {
  const tipTextEl = document.getElementById('tipText');
  let currentTipIndex = Math.floor(Math.random() * tips.length);
  tipTextEl.innerHTML = tips[currentTipIndex];
  tipInterval = setInterval(() => {
    tipTextEl.style.opacity = '0';
    setTimeout(() => {
      currentTipIndex = (currentTipIndex + 1) % tips.length;
      tipTextEl.innerHTML = tips[currentTipIndex];
      tipTextEl.style.opacity = '1';
    }, 400);
  }, 4000);
}

const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec";
const CACHE_KEY = `trackedu_license_${schoolId}`;

(function instantGatekeeper() {
  const cachedData = localStorage.getItem(CACHE_KEY);
  let loadedUrl = null;
  if (cachedData) {
    try {
      const data = JSON.parse(cachedData);
      loadedUrl = data.url;
      loadIframeSilently(data);
    } catch(e) { localStorage.removeItem(CACHE_KEY); }
  }
  
  fetch(`${GATEKEEPER_URL}?id=${schoolId}`)
    .then(r => r.json())
    .then(newData => {
      if (!newData.success) {
        showHardLock(newData.reason);
      } else {
        localStorage.setItem(CACHE_KEY, JSON.stringify(newData));
        if (cachedData && loadedUrl !== newData.url) {
          loadIframeSilently(newData);
        } else if (!cachedData) {
          loadIframeSilently(newData);
        }
      }
    }).catch(() => {
      if (!cachedData) showHardLock("Connection Error. Please check your internet.");
    });
})();

function loadIframeSilently(data) {
  let url = data.url;
  url += (url.includes('?') ? '&' : '?') + "expiry=" + encodeURIComponent(data.expiry) + "&tier=" + encodeURIComponent(data.tier);
  if (isStudentApp) url += "&view=house-students";

  const frame = document.getElementById('appFrame');
  
  // ⚡ THE FIX: Bind the onload event BEFORE setting the source to prevent cache race conditions
  frame.onload = () => {
    setTimeout(() => {
      appReady = true;
      if (userWaiting) revealApp();
    }, 400); // Snappier load
  };
  
  frame.src = url;
}

function handleLaunchClick() {
  // ⚡ THE FIX: Catch strict browser vibration blocks
  try { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(); } catch(e) {}

  if (appReady) {
    revealApp(); 
  } else {
    userWaiting = true;
    document.getElementById('initialState').style.display = 'none';
    const loadingState = document.getElementById('loadingState');
    loadingState.style.display = 'flex';
    loadingState.classList.add('flex'); 
    startTipCarousel();

    // ⚡ THE FIX: Ensure users never get permanently stuck
    setTimeout(() => {
      if (!appReady) {
        document.getElementById('loadingState').innerHTML += `
        <div style="margin-top:20px; width:100%; border-top:1px solid #e2e8f0; padding-top:15px;">
          <button onclick="forceReveal()" style="background:#f1f5f9; color:#1e40af; border:none; padding:12px; border-radius:8px; width:100%; font-weight:700; cursor:pointer;">
             Skip Loading <i class="fas fa-arrow-right"></i>
          </button>
        </div>`;
      }
    }, 7000);
  }
}

function forceReveal() {
  appReady = true;
  revealApp();
}

function revealApp() {
  if (authFailed) return; 
  if (tipInterval) clearInterval(tipInterval);
  const loader = document.getElementById('welcomeScreen');
  const frame = document.getElementById('appFrame');
  
  if (loader && loader.style.display !== 'none') {
    frame.style.opacity = '1';
    loader.classList.add('expanding');
    setTimeout(() => {
      loader.style.display = 'none';
      loader.remove();
    }, 800);
  }
}

function showHardLock(reason) {
  authFailed = true;
  if (tipInterval) clearInterval(tipInterval);
  localStorage.removeItem(CACHE_KEY);
  const frame = document.getElementById('appFrame');
  if (frame) frame.remove();

  const welcomeScreen = document.getElementById('welcomeScreen');
  welcomeScreen.style.opacity = '1';
  welcomeScreen.classList.remove('expanding');
  welcomeScreen.innerHTML = `
  <div class="executive-card" style="border-top: 6px solid #ef4444; padding: 40px 30px;">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: #fef2f2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px;">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h1 class="welcome-title" style="color:#0f172a; font-size: 22px; margin-bottom: 12px;">TrackEDU Access Paused</h1>
    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; width: 100%; margin-bottom: 25px; text-align: left;">
      <div style="font-size: 13px; font-weight: 600; color: #ef4444; margin-top: 4px;">${reason || "Account access update required."}</div>
    </div>
    <button onclick="window.location.reload()" class="btn-launch" style="background:#ffffff; color:#475569; box-shadow:none; border:2px solid #e2e8f0; padding: 14px; font-size: 14px;">
      <i class="fas fa-sync-alt" style="margin-right: 6px;"></i> Refresh Connection
    </button>
  </div>`;
}
</script>
</body>
</html>
