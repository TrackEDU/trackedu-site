<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>TrackEDU House Points</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://trackedu.github.io">

<script>
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

// --- APP IDENTITY ---
const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
document.title = appName;

// --- APP ICON ---
const appIcon = isStudentApp
? 'https://trackedu.github.io/common-assets/studentapp.png'
: 'https://trackedu.github.io/common-assets/teacherapp.png';

// --- MANIFEST ---
// --- APP THEME COLOR ---
const themeColor = "#ffffff";

// Add physical meta tag for browser UI
const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

// --- MANIFEST ---
const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: isStudentApp 
    ? window.location.origin + window.location.pathname + `?id=${schoolId}&view=public` 
    : window.location.origin + window.location.pathname + `?id=${schoolId}`,
  display: "standalone", // Changed to standalone for better compatibility than fullscreen
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { 
      src: appIcon, 
      sizes: "192x192", 
      type: "image/png",
      purpose: "any maskable" 
    },
    { 
      src: appIcon, 
      sizes: "512x512", 
      type: "image/png",
      purpose: "any maskable"
    }
  ]
};

const manifestBlob = new Blob(
[JSON.stringify(baseManifest)],
{ type: 'application/json' }
);
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('/sw.js').then(reg => {
reg.addEventListener('updatefound', () => {
const newWorker = reg.installing;
newWorker.addEventListener('statechange', () => {
if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
document.getElementById('updateToast').style.display = 'block';
}
});
});
});
}
</script>

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background-color: #ffffff;
}

#loadingScreen {
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 9999;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
transition: opacity 0.5s ease;
}

.loading-logo-img {
  width: 300px; /* Increased size */
  height: auto;
  margin-bottom: 15px;
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.9; }
}

iframe {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
border: none;
z-index: 1;
opacity: 0;
transition: opacity 0.5s;
}

.loading-text {
margin-top: 25px;
font-family: 'Poppins', sans-serif;
font-size: 18px;
font-weight: 400; /* Changed from 600 to 400 (Normal) */
text-align: center;
}

.text-white { color: #ffffff; }
.text-green { color: #22c55e; }
.text-gray {
color: #94a3b8;
font-weight: 400;
font-size: 14px;
display: block;
margin-top: 6px;
}

#installBtn {
display: none;
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background-color: #fbbf24;
color: #020617;
border: none;
padding: 12px 24px;
border-radius: 25px;
font-weight: 700;
z-index: 10000;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#updateToast {
display: none;
position: fixed;
top: 20px;
left: 50%;
transform: translateX(-50%);
background: #22c55e;
color: white;
padding: 12px 20px;
border-radius: 50px;
font-family: sans-serif;
font-weight: 700;
z-index: 10001;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
animation: slideDown 0.5s ease;
}

@keyframes slideDown {
from { top: -60px; }
to { top: 20px; }
}
</style>
</head>

<body>

<div id="updateToast" onclick="window.location.reload()">
✨ Update available — tap to refresh
</div>

<div id="loadingScreen">
  <img src="https://trackedu.github.io/common-assets/tsloading.png" class="loading-logo-img" alt="TrackEDU Logo">
  <div id="statusText" class="loading-text"></div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<button id="installBtn">📲 Install TrackEDU</button>

<script>
const statusDiv = document.getElementById('statusText');

statusDiv.innerHTML = `
  <span class="text-gray" style="font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">
    ${isStudentApp ? 'Student' : 'Teacher'} App
  </span>
`;

// --- CENTRALIZED LICENSING GATEKEEPER ---
const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec"; 

fetch(`${GATEKEEPER_URL}?id=${schoolId}`)
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      let finalUrl = data.url;
      
      if (isStudentApp) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + "view=house-students";
      }

      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;
      frame.onload = () => {
        setTimeout(() => {
          document.getElementById('loadingScreen').style.opacity = '0';
          frame.style.opacity = '1';
          setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
          }, 500);
        }, 200); 
      };
      
    } else {
      document.getElementById('loadingScreen').innerHTML = `
        <div style="text-align:center; padding: 20px;">
          <h2 style="color:white; font-family:sans-serif;">Access Restricted</h2>
          <p style="color:#94a3b8; font-family:sans-serif; max-width: 300px; margin: 0 auto; line-height: 1.5;">
            ${data.reason}
          </p>
        </div>
      `;
    }
  })
  .catch(error => {
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;">
        <h2 style="color:white; font-family:sans-serif;">Connection Error</h2>
        <p style="color:#94a3b8; font-family:sans-serif;">
          Please check your internet connection and refresh the page.
        </p>
      </div>
    `;
  });

// --- INSTALL PROMPT ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
e.preventDefault();
deferredPrompt = e;
document.getElementById('installBtn').style.display = 'block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
if (!deferredPrompt) return;
deferredPrompt.prompt();
const { outcome } = await deferredPrompt.userChoice;
if (outcome === 'accepted') {
document.getElementById('installBtn').style.display = 'none';
}
deferredPrompt = null;
});
</script>

</body>
</html>
