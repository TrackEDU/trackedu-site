<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>TrackEDU House Points</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://trackedu.github.io">

<script>
const params = new URLSearchParams(window.location.search);
const schoolId = params.get('id') || 'demo';
const isStudentApp = params.get('view') === 'public';

// --- APP IDENTITY ---
const appName = isStudentApp ? "TrackEDU Student" : "TrackEDU Teacher";
document.title = appName;

// --- APP ICON ---
const appIcon = isStudentApp
? 'https://trackedu.github.io/common-assets/studentapp.png'
: 'https://trackedu.github.io/common-assets/teacherapp.png';

// --- MANIFEST ---
const themeColor = "#ffffff";

// Add physical meta tag for browser UI
const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: isStudentApp 
    ? window.location.origin + window.location.pathname + `?id=${schoolId}&view=public` 
    : window.location.origin + window.location.pathname + `?id=${schoolId}`,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { 
      src: appIcon, 
      sizes: "192x192", 
      type: "image/png",
      purpose: "any maskable" 
    },
    { 
      src: appIcon, 
      sizes: "512x512", 
      type: "image/png",
      purpose: "any maskable"
    }
  ]
};

const manifestBlob = new Blob(
[JSON.stringify(baseManifest)],
{ type: 'application/json' }
);
const manifestURL = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestURL;
document.head.appendChild(manifestLink);

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('/sw.js').then(reg => {
reg.addEventListener('updatefound', () => {
const newWorker = reg.installing;
newWorker.addEventListener('statechange', () => {
if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
document.getElementById('updateToast').style.display = 'block';
}
});
});
});
}
</script>

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background-color: #ffffff;
}

#loadingScreen {
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s ease; /* Faster transition */
}

.loading-logo-img {
  width: 300px; 
  height: auto;
  margin-bottom: 15px;
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.9; }
}

iframe {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
border: none;
z-index: 1;
opacity: 0;
transition: opacity 0.5s;
}

.loading-text {
margin-top: 25px;
font-family: 'Poppins', sans-serif;
font-size: 18px;
font-weight: 400; 
text-align: center;
}

.text-gray {
color: #94a3b8;
font-weight: 400;
font-size: 14px;
display: block;
margin-top: 6px;
}

#installBtn {
display: none;
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background-color: #fbbf24;
color: #020617;
border: none;
padding: 12px 24px;
border-radius: 25px;
font-weight: 700;
z-index: 10000;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#updateToast {
display: none;
position: fixed;
top: 20px;
left: 50%;
transform: translateX(-50%);
background: #22c55e;
color: white;
padding: 12px 20px;
border-radius: 50px;
font-family: sans-serif;
font-weight: 700;
z-index: 10001;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
animation: slideDown 0.5s ease;
}

@keyframes slideDown {
from { top: -60px; }
to { top: 20px; }
}
</style>
</head>

<body>

<div id="updateToast" onclick="window.location.reload()">
✨ Update available — tap to refresh
</div>

<div id="loadingScreen">
  <img src="https://trackedu.github.io/common-assets/tsloading.png" class="loading-logo-img" alt="TrackEDU Logo">
  <div id="statusText" class="loading-text"></div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<button id="installBtn">📲 Install TrackEDU</button>

<script>
const statusText = document.getElementById('statusText');

// --- PHASE 1: INITIAL FEEDBACK ---
statusText.innerHTML = `
  <span class="text-gray" style="font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">
    🔒 Verifying License...
  </span>
`;

// --- CENTRALIZED LICENSING GATEKEEPER (OPTIMIZED) ---
const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbzqrrKj_6yEG_F7C032K1yvMxk9cLv2n-bFsRx6I0zuCUpkQo5pzzBPx7j4zmhxuBO73g/exec"; 

fetch(`${GATEKEEPER_URL}?id=${schoolId}`)
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // --- PHASE 2: SECURITY VERIFIED ---
      statusText.innerHTML = `
        <span style="color: #10b981; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">
          ✅ Security Verified. Launching...
        </span>
      `;
      
      let finalUrl = data.url;
      
      // Pass the parameters into the tool for the internal license bar
      if (data.expiry) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "expiry=" + encodeURIComponent(data.expiry);
      if (data.tier) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "tier=" + encodeURIComponent(data.tier);
      
      // PASS THE SOFT LOCK FLAG (Triggers Read-Only Mode)
      if (data.softExpired) finalUrl += (finalUrl.includes('?') ? '&' : '?') + "softLock=true";
      
      if (isStudentApp) {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + "view=house-students";
      }

      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;
      
      frame.onload = () => {
        // Optimized transition speed
        setTimeout(() => {
          document.getElementById('loadingScreen').style.opacity = '0';
          frame.style.opacity = '1';
          setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
          }, 400);
        }, 100); 
      };
      
    } else {
       // --- HARD LOCK UI (Level 2 Lockdown) ---
      document.getElementById('loadingScreen').innerHTML = `
        <div style="background-color: #ffffff; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px; box-sizing: border-box; text-align: center;">
          
          <div style="width: 150px; height: 150px; border-radius: 50%; background: #ffffff; border: 4px solid #ef4444; display: flex; align-items: center; justify-content: center; margin-bottom: 35px; box-shadow: 0 12px 30px -10px rgba(239, 68, 68, 0.3); overflow: hidden;">
            <i class="fas fa-user-lock" style="font-size: 60px; color: #ef4444;"></i>
          </div>
          
          <h1 style="font-size: 36px; font-weight: 800; margin: 0 0 15px 0; color: #000000; letter-spacing: -1px;">Access Suspended</h1>

          <p style="font-size: 18px; color: #4b5563; max-width: 480px; margin: 0 auto 35px auto; line-height: 1.5; font-weight: 500;">
            ${data.reason || "This school's access has been revoked. Please reach out to your administrator or the TrackEDU team to continue."}
          </p>
          
          <div style="height: 4px; width: 80px; background: #10b981; border-radius: 2px; margin-bottom: 45px;"></div>
          
          <div>
             <p style="font-weight: 700; color: #10b981; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; font-size: 14px;">TrackEDU.net</p>
            
            <a href="mailto:hello@trackedu.net" style="text-decoration: none; background: #10b981; color: #ffffff; padding: 16px 45px; border-radius: 60px; font-weight: 700; font-size: 18px; transition: all 0.2s ease; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); display: inline-block; border: 2px solid #10b981;">
              Contact TrackEDU
            </a>
            
            <p style="margin-top: 20px; font-size: 15px; color: #6b7280; font-weight: 500;">
              Direct Email: <a href="mailto:hello@trackedu.net" style="color: #1a1a1a; text-decoration: none; font-weight: 700; border-bottom: 2px solid rgba(16, 185, 129, 0.3);">hello@trackedu.net</a>
            </p>
          </div>
        </div>
      `;
    }
  })
  .catch(error => {
    document.getElementById('loadingScreen').innerHTML = `
      <div style="background-color: #ffffff; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; text-align: center; padding: 20px;">
        <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 15px; color: #000000;">Connection Error</h2>
        <p style="font-size: 16px; color: #4b5563; margin-bottom: 30px;">Unable to verify license. Please check your internet connection.</p>
         <button onclick="window.location.reload()" style="background: #10b981; color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">Try Again</button>
      </div>
    `;
  });

// --- INSTALL PROMPT ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
e.preventDefault();
deferredPrompt = e;
document.getElementById('installBtn').style.display = 'block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
if (!deferredPrompt) return;
deferredPrompt.prompt();
const { outcome } = await deferredPrompt.userChoice;
if (outcome === 'accepted') {
document.getElementById('installBtn').style.display = 'none';
}
deferredPrompt = null;
});
</script>

</body>
</html>
