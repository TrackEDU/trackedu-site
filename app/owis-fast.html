<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU - OWIS Admin (Fast Load)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
#loadingScreen { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
.loading-logo-img { width: 300px; height: auto; margin-bottom: 15px; animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; background-color: #ffffff; }
</style>
</head>

<body>
<div id="loadingScreen">
  <img src="https://trackedu.github.io/common-assets/tsloading.png" class="loading-logo-img" alt="TrackEDU Logo">
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<script>
// 🚀 DIRECT BYPASS - NO GATEKEEPER
// Hardcoded specifically to the OWIS deployment URL
const DIRECT_APP_URL = "https://script.google.com/a/globalschools.com/macros/s/AKfycbzOB8CReA-ZPz8LkkKc-GERQCcAXXD4Q1qfjTDFhibD27FGeGfqWsdVdI2x6E2LkutRxQ/exec"; 

// Instantly launch the iframe without waiting for verification
const frame = document.getElementById('appFrame');

// Append the ID and Tier so the backend still knows exactly how to format the tool
// Bypasses the network check, but tells the inner tool the license is valid until 2099
frame.src = DIRECT_APP_URL + "?id=owis&tier=Global%20Schools%20Tier&expiry=2099-12-31";

// Hide the loading screen exactly when the iframe finishes loading
frame.onload = () => {
  const loader = document.getElementById('loadingScreen');
  loader.style.opacity = '0';
  setTimeout(() => loader.style.display = 'none', 300);
};

// Failsafe: Hide loader after 5 seconds just in case
setTimeout(() => {
  const loader = document.getElementById('loadingScreen');
  if (loader && loader.style.display !== 'none') {
     loader.style.opacity = '0';
     setTimeout(() => loader.style.display = 'none', 300);
  }
}, 5000);
</script>
</body>
</html>
