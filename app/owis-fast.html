<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TrackEDU Digital House Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<script>
// --- RESTORE PWA MANIFEST SO THE IPAD RECOGNIZES IT AS AN APP ---
const appName = "TrackEDU";
const appIcon = 'https://trackedu.github.io/common-assets/teacherapp.png';
const themeColor = "#f8fafc"; // Soft slate background

const metaThemeColor = document.createElement('meta');
metaThemeColor.name = "theme-color";
metaThemeColor.content = themeColor;
document.head.appendChild(metaThemeColor);

const baseManifest = {
  name: appName,
  short_name: "TrackEDU",
  start_url: window.location.href,
  display: "standalone", 
  background_color: themeColor,
  theme_color: themeColor,
  orientation: "portrait",
  icons: [
    { src: appIcon, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: appIcon, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};

const manifestBlob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);
</script>

<style>
body, html { 
  margin: 0; padding: 0; height: 100%; overflow: hidden; 
  background-color: #f8fafc; font-family: 'Inter', sans-serif;
}

iframe { 
  position: fixed; inset: 0; width: 100%; height: 100%; border: none; 
  z-index: 1; background-color: #ffffff; opacity: 0; transition: opacity 0.4s ease; 
}

/* --- PRO-TIP LOADING SCREEN STYLES --- */
#loadingScreen { 
  position: fixed; inset: 0; background: #f8fafc; z-index: 9999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
  transition: opacity 0.5s ease; padding: 20px; text-align: center;
}

.loading-logo-img { 
  width: 180px; height: auto; margin-bottom: 40px; 
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
}

.tip-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  padding: 30px 25px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
  margin-bottom: 40px;
}

.tip-header {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: #3b82f6; font-weight: 800; font-size: 14px; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 12px;
}

.tip-text {
  font-size: 16px; color: #334155; line-height: 1.5; font-weight: 600;
  min-height: 72px; /* Prevents card height from jumping */
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.3s ease;
}

.loading-status {
  display: flex; align-items: center; gap: 12px;
  color: #64748b; font-weight: 600; font-size: 14px;
}

/* Clean CSS Spinner */
.spinner {
  width: 20px; height: 20px;
  border: 3px solid #cbd5e1; border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>

<div id="loadingScreen">
  <img src="https://trackedu.github.io/common-assets/tsloading.png" class="loading-logo-img" alt="TrackEDU Logo">
  
  <div class="tip-card">
    <div class="tip-header">
      <span style="font-size: 18px;">💡</span> Pro Tip
    </div>
    <div class="tip-text" id="tipText">Loading tips...</div>
  </div>

  <div class="loading-status">
    <div class="spinner"></div>
    <span>Connecting to classroom...</span>
  </div>
</div>

<iframe id="appFrame" allow="fullscreen"></iframe>

<script>
// --- PRO TIP CAROUSEL LOGIC ---
const tips = [
  "Use the Magic Hat in the Teacher Toolkit to pick random students for cold-calling!",
  "Create a 'Secret Code' in Loot Drops and hide it on the whiteboard for early finishers.",
  "Students who log in to the Student App 5 days in a row get a bonus point streak reward.",
  "You can award points to an entire class at once using the 'Award House Points' button.",
  "Use Duo Mode to show a countdown timer and pick random students at the same time.",
  "Every milestone a student hits unlocks a holographic collectible card in their binder."
];

const tipTextEl = document.getElementById('tipText');

// 1. Pick a random tip immediately
let currentTipIndex = Math.floor(Math.random() * tips.length);
tipTextEl.innerText = tips[currentTipIndex];

// 2. Cycle tips every 4 seconds
const tipInterval = setInterval(() => {
  tipTextEl.style.opacity = '0'; // Fade out
  setTimeout(() => {
    currentTipIndex = (currentTipIndex + 1) % tips.length;
    tipTextEl.innerText = tips[currentTipIndex];
    tipTextEl.style.opacity = '1'; // Fade in
  }, 300);
}, 4000);

// --- APP LOADING LOGIC ---
const DIRECT_APP_URL = "https://script.google.com/a/globalschools.com/macros/s/AKfycbzOB8CReA-ZPz8LkkKc-GERQCcAXXD4Q1qfjTDFhibD27FGeGfqWsdVdI2x6E2LkutRxQ/exec?id=owis&tier=Global%20Schools%20Tier&expiry=2099-12-31"; 

// ⚡ UI THREAD UNLOCKER
window.addEventListener('load', () => {
  window.requestAnimationFrame(() => {
    window.requestAnimationFrame(() => {
      // Let the iPad draw the beautiful tip card first, then lock up the CPU fetching Google
      setTimeout(() => {
        const frame = document.getElementById('appFrame');
        frame.src = DIRECT_APP_URL;

        frame.onload = () => {
          clearInterval(tipInterval); // Stop cycling tips
          frame.style.opacity = '1';
          const loader = document.getElementById('loadingScreen');
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 500);
        };
      }, 300); 
    });
  });
});

// Failsafe: Hide loader after 15 seconds
setTimeout(() => {
  clearInterval(tipInterval);
  const loader = document.getElementById('loadingScreen');
  if (loader && loader.style.display !== 'none') {
     document.getElementById('appFrame').style.opacity = '1';
     loader.style.opacity = '0';
     setTimeout(() => loader.style.display = 'none', 500);
  }
}, 15000);
</script>
</body>
</html>
