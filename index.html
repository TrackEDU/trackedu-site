<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrackEDU – House Points System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/Td99j4e.png">

    <style>
        /* Force full screen with no scrollbars on the wrapper */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        
        /* The iframe fills the window */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        id="appFrame" 
        allow="geolocation; microphone; camera; fullscreen"
        sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-top-navigation">
    </iframe>

    <script>
        // 1. Your Google Deployment URL
        const scriptUrl = "https://script.google.com/macros/s/AKfycbw2jfDz2Zbskn5jppl4fXqLxtqGfqjabRMMmBt82Qm9Tsoy2nhOoQOc2N4bWNBw-Do07Q/exec";

        // 2. Capture parameters (like ?view=scheduler) from the browser bar
        const urlParams = window.location.search;

        // 3. Pass them to the Google Script inside the iframe
        document.getElementById('appFrame').src = scriptUrl + urlParams;
    </script>

</body>
</html>
