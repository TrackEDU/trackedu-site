<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calm Meter | Classroom Noise Tool</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* Main Modal Container - Full Screen, No Scrolling */
    #calmMeterApp {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: #ffffff;
      background: radial-gradient(circle at 22% 18%, rgba(52, 211, 153, 0.18), transparent 34%),
                  linear-gradient(135deg, #07111f 0%, #0f172a 48%, #111827 100%);
      overflow: hidden;
      z-index: 10000;
    }

    /* State Backgrounds */
    #calmMeterApp.state-quiet {
      background: radial-gradient(circle at 26% 24%, rgba(52, 211, 153, 0.30), transparent 36%),
                  radial-gradient(circle at 80% 75%, rgba(16, 185, 129, 0.16), transparent 38%),
                  linear-gradient(135deg, #071b16 0%, #0f172a 50%, #10251d 100%);
    }
    #calmMeterApp.state-warning {
      background: radial-gradient(circle at 26% 24%, rgba(245, 158, 11, 0.36), transparent 36%),
                  radial-gradient(circle at 80% 75%, rgba(251, 191, 36, 0.18), transparent 38%),
                  linear-gradient(135deg, #211608 0%, #0f172a 50%, #241804 100%);
    }
    #calmMeterApp.state-loud {
      background: radial-gradient(circle at 26% 24%, rgba(239, 68, 68, 0.40), transparent 36%),
                  radial-gradient(circle at 80% 75%, rgba(251, 113, 133, 0.16), transparent 38%),
                  linear-gradient(135deg, #26070b 0%, #111827 48%, #2b0b11 100%);
    }
    #calmMeterApp.state-reward {
      background: radial-gradient(circle at 26% 20%, rgba(250, 204, 21, 0.38), transparent 36%),
                  radial-gradient(circle at 80% 75%, rgba(34, 197, 94, 0.25), transparent 38%),
                  linear-gradient(135deg, #0b2216 0%, #0f172a 48%, #251a05 100%);
    }

    /* Header */
    .calm-header {
      background: rgba(7, 17, 31, 0.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text { font-family: 'Fredoka One', cursive; font-size: 1.2rem; }
    .logo-text span:first-child { color: #f8fafc; }
    .logo-text span:last-child { color: #10b981; }

    .points-badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 40px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }
    .points-badge i { color: #fbbf24; }
    .points-value { font-size: 1.3rem; color: #fbbf24; }

    .sound-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Layout - Split Screen */
    .main-layout {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      overflow: hidden;
    }

    /* Left Side - Character Area */
    .character-area {
      flex: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stage {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-glow {
      position: absolute;
      width: 45vw;
      height: 45vw;
      max-width: 500px;
      max-height: 500px;
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(8px);
      background: radial-gradient(circle, var(--state-color, #10b981), transparent 70%);
      animation: breatheGlow 2.8s ease-in-out infinite;
    }

    @keyframes breatheGlow {
      0%, 100% { transform: scale(0.94); opacity: 0.18; }
      50% { transform: scale(1.04); opacity: 0.32; }
    }

    .mascot-img {
      width: 35vw;
      height: 35vw;
      max-width: 320px;
      max-height: 320px;
      object-fit: contain;
      filter: drop-shadow(0 26px 35px rgba(0,0,0,0.42));
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .state-quiet .mascot-img { animation: floatCalm 3.8s ease-in-out infinite; }
    .state-warning .mascot-img { animation: shakeWarning 1.1s ease-in-out infinite; }
    .state-loud .mascot-img { animation: shakeLoud 0.48s ease-in-out infinite; }
    .state-reward .mascot-img { animation: bounceCelebrate 0.9s ease-in-out infinite; }

    @keyframes floatCalm { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shakeWarning { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes shakeLoud { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes bounceCelebrate { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-15px); } }

    .message-card {
      margin-top: 20px;
      text-align: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.64);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.14);
    }
    .main-message { font-size: clamp(24px, 4vw, 48px); font-weight: 900; letter-spacing: -0.02em; }
    .sub-message { font-size: clamp(12px, 1.5vw, 16px); color: #94a3b8; margin-top: 4px; }

    /* Right Side - Controls Area */
    .controls-area {
      flex: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-width: 320px;
    }

    .control-card {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 32px;
      padding: 24px;
    }

    /* Volume Meter */
    .volume-meter { margin-bottom: 24px; }
    .meter-bar {
      height: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 10px;
    }
    .meter-labels { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; font-weight: 600; }

    /* Timer */
    .timer-section {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }
    .timer-display {
      font-family: monospace;
      font-size: 3.5rem;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 4px;
    }
    .timer-progress {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin: 12px 0;
      overflow: hidden;
    }
    .timer-progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #fbbf24);
      transition: width 0.3s linear;
    }
    .timer-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

    /* Goal Selector Row */
    .goal-row {
      display: flex;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .goal-select {
      flex: 2;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 10px;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .goal-select option { background: #1e293b; }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
    .btn-danger { background: rgba(239,68,68,0.2); border: 1px solid rgba(248,113,113,0.3); color: #fecaca; }
    .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; }

    /* Next Unlocks Strip */
    .next-strip {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .next-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; text-align: center; }
    .unlock-grid { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .unlock-item { text-align: center; opacity: 0.6; transition: all 0.3s; }
    .unlock-item.soon { opacity: 0.9; }
    .unlock-avatar {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }
    .unlock-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .unlock-name { font-size: 10px; font-weight: 700; }
    .unlock-points { font-size: 8px; color: #fbbf24; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .footer a { color: #10b981; text-decoration: none; font-weight: 600; }
    .footer a:hover { color: #fbbf24; }
    .footer small { font-size: 10px; color: #475569; display: block; margin-top: 4px; }

    /* Status */
    .status-text {
      margin-top: 16px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }

    /* Responsive - Stack on mobile */
    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
      .character-area { flex: 1; min-height: 0; }
      .controls-area { flex: 1; min-height: 0; padding: 10px; }
      .control-card { padding: 16px; max-width: 100%; }
      .mascot-img { width: 40vw; height: 40vw; max-width: 200px; max-height: 200px; }
      .stage-glow { width: 60vw; height: 60vw; }
      .timer-display { font-size: 2.5rem; }
      .btn { padding: 10px; font-size: 11px; }
      .btn span { display: none; }
      .btn i { margin: 0; }
      .goal-select { font-size: 11px; }
    }
  </style>
</head>
<body>

<div id="calmMeterApp" class="state-quiet">
  <div class="calm-header">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-leaf"></i></div>
      <div class="logo-text"><span>Calm</span><span>Meter</span></div>
    </div>
    <div class="points-badge">
      <i class="fas fa-star"></i>
      <span class="points-value" id="totalPointsDisplay">0</span>
      <span style="font-size: 0.7rem;">PTS</span>
    </div>
    <button class="sound-btn" id="soundToggleBtn">
      <i class="fas fa-volume-up"></i>
    </button>
  </div>

  <div class="main-layout">
    <!-- LEFT: Character Area -->
    <div class="character-area">
      <div class="stage">
        <div class="stage-glow"></div>
        <img id="stateMascot" class="mascot-img" src="https://trackedu.github.io/common-assets/state1a.png" alt="Mascot">
        <div class="message-card">
          <div class="main-message" id="mainMessage">Shhhhh...</div>
          <div class="sub-message" id="subMessage">Keep the calm going.</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Controls Area -->
    <div class="controls-area">
      <div class="control-card">
        <!-- Volume Meter -->
        <div class="volume-meter">
          <div class="meter-bar">
            <div class="meter-fill" id="volumeFill"></div>
          </div>
          <div class="meter-labels">
            <span>🌱 Quiet</span>
            <span>⚠️ Getting loud</span>
            <span>🔴 Too loud</span>
          </div>
        </div>

        <!-- Timer -->
        <div class="timer-section">
          <div class="timer-display" id="timerDisplay">03:00</div>
          <div class="timer-progress">
            <div class="timer-progress-fill" id="timerProgress"></div>
          </div>
          <div class="timer-label" id="timerLabel">Goal: 3 minutes of calm</div>
        </div>

        <!-- Goal Selector -->
        <div class="goal-row">
          <select id="goalSelect" class="goal-select">
            <option value="60">1 minute</option>
            <option value="180" selected>3 minutes</option>
            <option value="300">5 minutes</option>
            <option value="600">10 minutes</option>
            <option value="1200">20 minutes</option>
            <option value="1800">30 minutes</option>
          </select>
          <select id="pointsSelect" class="goal-select" style="flex:1;">
            <option value="1">+1 pt per 10s</option>
            <option value="2" selected>+2 pts per 10s</option>
            <option value="3">+3 pts per 10s</option>
            <option value="4">+4 pts per 10s</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button id="startBtn" class="btn btn-primary"><i class="fas fa-play"></i> <span>Start</span></button>
          <button id="stopBtn" class="btn btn-danger" style="display:none;"><i class="fas fa-stop"></i> <span>Stop</span></button>
          <button id="resetPointsBtn" class="btn btn-secondary"><i class="fas fa-undo-alt"></i> <span>Reset</span></button>
        </div>

        <!-- Next Unlocks -->
        <div class="next-strip">
          <div class="next-title">✦ NEXT UNLOCKS ✦</div>
          <div class="unlock-grid" id="nextUnlocksGrid"></div>
        </div>

        <div class="status-text" id="statusText">
          <i class="fas fa-microphone-alt"></i> Ready to start. Click Start and allow microphone.
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="https://trackedu.net" target="_blank">🐘 Made with love by TrackEDU</a>
    <small>Explore 12+ free classroom tools →</small>
  </div>
</div>

<script>
  // ==========================================
  // CALM METER - FULL SCREEN VERSION
  // 4 states with PNG images, 30 character unlocks
  // No scrolling, fully visible on all devices
  // ==========================================

  // --- STATE IMAGES (4 states from your existing assets) ---
  const STATE_IMAGES = {
    quiet: ['https://trackedu.github.io/common-assets/state1a.png', 'https://trackedu.github.io/common-assets/state1b.png'],
    warning: ['https://trackedu.github.io/common-assets/state2a.png', 'https://trackedu.github.io/common-assets/state2b.png'],
    loud: ['https://trackedu.github.io/common-assets/state3a.png', 'https://trackedu.github.io/common-assets/state3b.png'],
    reward: ['https://trackedu.github.io/common-assets/state4a.png', 'https://trackedu.github.io/common-assets/state4b.png']
  };

  const STATE_MESSAGES = {
    quiet: { main: 'Shhhhh...', sub: 'Keep the calm going.' },
    warning: { main: 'Too loud...', sub: 'Bring voices down.' },
    loud: { main: 'Pause!', sub: 'Let\'s reset our voices.' },
    reward: { main: 'Great job!', sub: 'You kept the class calm!' }
  };

  // --- 30 CHARACTERS FOR POINTS UNLOCKS ---
  const CHARACTERS = [
    { url: "https://trackedu.github.io/common-assets/1b.png", name: "Curious Explorer", threshold: 0 },
    { url: "https://trackedu.github.io/common-assets/1.png", name: "Eager Investigator", threshold: 50 },
    { url: "https://trackedu.github.io/common-assets/2.png", name: "Lifelong Inquirer", threshold: 100 },
    { url: "https://trackedu.github.io/common-assets/3.png", name: "Knowledge Seeker", threshold: 150 },
    { url: "https://trackedu.github.io/common-assets/5.png", name: "Global Learner", threshold: 200 },
    { url: "https://trackedu.github.io/common-assets/6.png", name: "Wisdom Keeper", threshold: 250 },
    { url: "https://trackedu.github.io/common-assets/7.png", name: "Creative Thinker", threshold: 300 },
    { url: "https://trackedu.github.io/common-assets/8.png", name: "Problem Solver", threshold: 350 },
    { url: "https://trackedu.github.io/common-assets/9.png", name: "Reasoned Analyst", threshold: 400 },
    { url: "https://trackedu.github.io/common-assets/10.png", name: "Clear Communicator", threshold: 450 },
    { url: "https://trackedu.github.io/common-assets/11.png", name: "Active Listener", threshold: 500 },
    { url: "https://trackedu.github.io/common-assets/12.png", name: "Voice of Unity", threshold: 550 },
    { url: "https://trackedu.github.io/common-assets/13.png", name: "Honest Ally", threshold: 600 },
    { url: "https://trackedu.github.io/common-assets/14.png", name: "Fairness Champion", threshold: 650 },
    { url: "https://trackedu.github.io/common-assets/15.png", name: "Principled Leader", threshold: 700 },
    { url: "https://trackedu.github.io/common-assets/16.png", name: "Open Mind", threshold: 750 },
    { url: "https://trackedu.github.io/common-assets/17.png", name: "Perspective Seeker", threshold: 800 },
    { url: "https://trackedu.github.io/common-assets/18.png", name: "Global Citizen", threshold: 850 },
    { url: "https://trackedu.github.io/common-assets/19.png", name: "Caring Peer", threshold: 900 },
    { url: "https://trackedu.github.io/common-assets/20.png", name: "Community Helper", threshold: 950 },
    { url: "https://trackedu.github.io/common-assets/21.png", name: "Compassionate Heart", threshold: 1000 },
    { url: "https://trackedu.github.io/common-assets/22.png", name: "Brave Pioneer", threshold: 1100 },
    { url: "https://trackedu.github.io/common-assets/23.png", name: "Resilient Spirit", threshold: 1200 },
    { url: "https://trackedu.github.io/common-assets/24.png", name: "Fearless Innovator", threshold: 1300 },
    { url: "https://trackedu.github.io/common-assets/25.png", name: "Balanced Scholar", threshold: 1400 },
    { url: "https://trackedu.github.io/common-assets/29.png", name: "Well-rounded Peer", threshold: 1500 },
    { url: "https://trackedu.github.io/common-assets/26.png", name: "Harmony Builder", threshold: 1600 },
    { url: "https://trackedu.github.io/common-assets/27.png", name: "Reflective Thinker", threshold: 1700 },
    { url: "https://trackedu.github.io/common-assets/28.png", name: "Mindful Mentor", threshold: 1800 },
    { url: "https://trackedu.github.io/common-assets/30.png", name: "Global Luminary", threshold: 2000 }
  ];

  // Audio state
  let soundEnabled = true;
  let mediaStream = null;
  let audioContext = null;
  let sourceNode = null;
  let analyserNode = null;
  let animationId = null;
  let isMonitoring = false;

  // Timer state
  let timerInterval = null;
  let timerSeconds = 180;
  let totalTargetSeconds = 180;
  let currentCalmSeconds = 0;
  let isInNoiseZone = false;
  let streakAwarded = false;

  // Points state
  let totalPoints = 0;
  let pointsPer10Sec = 2;
  let currentState = 'quiet';
  let lastState = null;
  let currentVolume = 0;
  let imageIndex = 0;

  // DOM elements
  const app = document.getElementById('calmMeterApp');
  const volumeFill = document.getElementById('volumeFill');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerProgress = document.getElementById('timerProgress');
  const timerLabel = document.getElementById('timerLabel');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const totalPointsSpan = document.getElementById('totalPointsDisplay');
  const stateMascot = document.getElementById('stateMascot');
  const mainMessageSpan = document.getElementById('mainMessage');
  const subMessageSpan = document.getElementById('subMessage');
  const statusTextSpan = document.getElementById('statusText');
  const goalSelect = document.getElementById('goalSelect');
  const pointsSelect = document.getElementById('pointsSelect');
  const resetPointsBtn = document.getElementById('resetPointsBtn');

  // ==========================================
  // LOCALSTORAGE PERSISTENCE
  // ==========================================
  function loadPoints() {
    const saved = localStorage.getItem('calmmeter_points_v2');
    if (saved !== null) totalPoints = parseInt(saved);
    else totalPoints = 0;
    updatePointsDisplay();
    updateCharacterByPoints();
    updateNextUnlocks();
  }

  function savePoints() {
    localStorage.setItem('calmmeter_points_v2', totalPoints);
    updatePointsDisplay();
    updateCharacterByPoints();
    updateNextUnlocks();
  }

  function addPoints(amount) {
    totalPoints += amount;
    savePoints();
    
    const newCharIndex = getCharacterIndexForPoints(totalPoints);
    const oldCharIndex = getCharacterIndexForPoints(totalPoints - amount);
    if (newCharIndex > oldCharIndex) {
      // New character unlocked!
      playFanfareSound();
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
      showStatusMessage(`🎉 NEW CHARACTER UNLOCKED: ${CHARACTERS[newCharIndex].name}!`, 'success');
    }
  }

  function resetPoints() {
    if (confirm('Reset all points? This will reset your character progress too.')) {
      totalPoints = 0;
      savePoints();
      showStatusMessage('Points reset to 0!', 'info');
      playPopSound();
    }
  }

  function getCharacterIndexForPoints(points) {
    let idx = 0;
    for (let i = CHARACTERS.length - 1; i >= 0; i--) {
      if (points >= CHARACTERS[i].threshold) { idx = i; break; }
    }
    return idx;
  }

  function updateCharacterByPoints() {
    const idx = getCharacterIndexForPoints(totalPoints);
    // Update the mascot image to show the unlocked character (but keep state animation separate)
    // This is subtle - the character evolves in the background
    const char = CHARACTERS[idx];
    // Don't override state image - state animation is separate
  }

  function updatePointsDisplay() {
    totalPointsSpan.textContent = totalPoints.toLocaleString();
  }

  function updateNextUnlocks() {
    const container = document.getElementById('nextUnlocksGrid');
    const currentIdx = getCharacterIndexForPoints(totalPoints);
    const nextChars = CHARACTERS.slice(currentIdx + 1, currentIdx + 4);
    
    if (nextChars.length === 0) {
      container.innerHTML = '<div style="color: #fbbf24;">🏆 MAX LEVEL REACHED! 🏆</div>';
      return;
    }
    
    container.innerHTML = nextChars.map(c => `
      <div class="unlock-item soon">
        <div class="unlock-avatar"><img src="${c.url}" alt="${c.name}"></div>
        <div class="unlock-name">${c.name}</div>
        <div class="unlock-points">${c.threshold} pts</div>
      </div>
    `).join('');
  }

  // ==========================================
  // STATE MANAGEMENT (4 states with images)
  // ==========================================
  function setState(state, force = false) {
    if (!force && currentState === state) return;
    if (state === 'reward' && currentState === 'reward') return;
    
    currentState = state;
    
    // Update CSS class for background
    app.classList.remove('state-quiet', 'state-warning', 'state-loud', 'state-reward');
    app.classList.add(`state-${state}`);
    
    // Update messages
    const msg = STATE_MESSAGES[state];
    mainMessageSpan.textContent = msg.main;
    subMessageSpan.textContent = msg.sub;
    
    // Animate image change
    const images = STATE_IMAGES[state];
    imageIndex = (imageIndex + 1) % images.length;
    stateMascot.style.opacity = '0';
    setTimeout(() => {
      stateMascot.src = images[imageIndex];
      stateMascot.style.opacity = '1';
    }, 100);
    
    // If reward state, add points bonus (only once)
    if (state === 'reward' && !streakAwarded) {
      const bonus = parseInt(pointsSelect.value) * 5;
      addPoints(bonus);
      showStatusMessage(`🎉 Calm goal reached! +${bonus} bonus points!`, 'success');
    }
    
    lastState = state;
  }

  // ==========================================
  // TIMER FUNCTIONS
  // ==========================================
  function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    const percent = (timerSeconds / totalTargetSeconds) * 100;
    timerProgress.style.width = `${Math.max(0, percent)}%`;
  }

  function setGoal() {
    totalTargetSeconds = parseInt(goalSelect.value);
    timerSeconds = totalTargetSeconds;
    pointsPer10Sec = parseInt(pointsSelect.value);
    updateTimerDisplay();
    timerLabel.textContent = `Goal: ${totalTargetSeconds / 60} minutes of calm`;
    currentCalmSeconds = 0;
    streakAwarded = false;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isMonitoring) return;
      
      // Only count down if not in noise zone
      if (!isInNoiseZone && timerSeconds > 0 && !streakAwarded) {
        timerSeconds--;
        currentCalmSeconds++;
        updateTimerDisplay();
        
        // Award points every 10 seconds of calm
        if (currentCalmSeconds >= 10) {
          const pointsToAdd = pointsPer10Sec;
          addPoints(pointsToAdd);
          currentCalmSeconds = 0;
          showFloatingPoints(pointsToAdd);
          playTickSound();
        }
        
        if (timerSeconds <= 0 && !streakAwarded) {
          streakAwarded = true;
          setState('reward', true);
          playFanfareSound();
          confetti({ particleCount: 300, spread: 120, origin: { y: 0.5 } });
        }
      }
    }, 1000);
  }

  function resetTimer() {
    timerSeconds = totalTargetSeconds;
    currentCalmSeconds = 0;
    streakAwarded = false;
    updateTimerDisplay();
    if (currentState === 'reward') setState('quiet', true);
  }

  // ==========================================
  // VOLUME METER & AUDIO
  // ==========================================
  async function initAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatusMessage('This browser does not support microphone access.', 'error');
      return false;
    }
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      mediaStream = stream;
      
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 256;
      analyserNode.smoothingTimeConstant = 0.7;
      
      sourceNode = audioContext.createMediaStreamSource(stream);
      sourceNode.connect(analyserNode);
      
      if (audioContext.state === 'suspended') await audioContext.resume();
      return true;
    } catch (error) {
      showStatusMessage('Microphone access denied. Please allow microphone to use Calm Meter.', 'error');
      return false;
    }
  }

  function startVolumeLoop() {
    if (!isMonitoring || !analyserNode) return;
    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
    
    function updateVolume() {
      if (!isMonitoring || !analyserNode) return;
      analyserNode.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      let percent = Math.min(100, Math.round((sum / dataArray.length / 255) * 100));
      percent = Math.round(Math.pow(percent / 100, 0.7) * 100);
      currentVolume = percent;
      
      volumeFill.style.width = `${percent}%`;
      
      // Determine state based on volume
      if (percent < 30) {
        volumeFill.style.background = '#10b981';
        isInNoiseZone = false;
        setState('quiet');
      } else if (percent < 65) {
        volumeFill.style.background = '#f59e0b';
        isInNoiseZone = true;
        setState('warning');
      } else {
        volumeFill.style.background = '#ef4444';
        isInNoiseZone = true;
        setState('loud');
      }
      
      animationId = requestAnimationFrame(updateVolume);
    }
    updateVolume();
  }

  function stopVolumeLoop() {
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    volumeFill.style.width = '0%';
  }

  async function startMeter() {
    const audioReady = await initAudio();
    if (!audioReady) return;
    
    isMonitoring = true;
    startVolumeLoop();
    startTimer();
    
    startBtn.style.display = 'none';
    stopBtn.style.display = 'flex';
    showStatusMessage('Calm Meter started! Stay quiet to earn points.', 'success');
  }

  function stopMeter() {
    isMonitoring = false;
    stopVolumeLoop();
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (audioContext) { audioContext.close(); audioContext = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    
    startBtn.style.display = 'flex';
    stopBtn.style.display = 'none';
    setState('quiet', true);
    showStatusMessage('Stopped. Click Start to resume.', 'info');
  }

  // ==========================================
  // SOUND EFFECTS
  // ==========================================
  function playTickSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
      osc.stop(ctx.currentTime + 0.1);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
  }

  function playPopSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 523.25;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
      osc.stop(ctx.currentTime + 0.15);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
  }

  function playFanfareSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + (i * 0.12));
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        osc.stop(ctx.currentTime + 0.5);
      });
      setTimeout(() => ctx.close(), 800);
    } catch(e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggleBtn');
    btn.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
  }

  // ==========================================
  // UI HELPERS
  // ==========================================
  function showStatusMessage(msg, type = 'info') {
    statusTextSpan.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
    setTimeout(() => {
      if (statusTextSpan.innerHTML.includes(msg)) {
        statusTextSpan.innerHTML = '<i class="fas fa-microphone-alt"></i> ' + (isMonitoring ? 'Listening. Stay quiet to earn points.' : 'Ready to start. Click Start and allow microphone.');
      }
    }, 4000);
  }

  function showFloatingPoints(points) {
    const floatEl = document.createElement('div');
    floatEl.textContent = `+${points}`;
    floatEl.style.cssText = `
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px #fbbf24;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 1.5s ease-out forwards;
      font-family: 'Fredoka One', cursive;
    `;
    document.body.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 1500);
  }

  // Add animation keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes floatUp {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      50% { transform: translate(-50%, -70%) scale(1.2); }
      100% { transform: translate(-50%, -120%) scale(1); opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  // ==========================================
  // EVENT LISTENERS & INIT
  // ==========================================
  goalSelect.addEventListener('change', () => { setGoal(); if (!isMonitoring) resetTimer(); });
  pointsSelect.addEventListener('change', () => { pointsPer10Sec = parseInt(pointsSelect.value); });
  resetPointsBtn.addEventListener('click', resetPoints);
  document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);
  
  startBtn.addEventListener('click', startMeter);
  stopBtn.addEventListener('click', stopMeter);

  // Initialize
  loadPoints();
  setGoal();
  
  showStatusMessage('Ready to start. Click Start and allow microphone.', 'info');
</script>
</body>
</html>
