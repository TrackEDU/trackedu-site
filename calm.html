<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Calm Meter | Classroom Noise Tool</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Header */
    .calm-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
    }

    .logo-text span:first-child { color: #f8fafc; }
    .logo-text span:last-child { color: #10b981; }

    .points-badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 40px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .points-badge i { color: #fbbf24; }
    .points-value { font-size: 1.3rem; color: #fbbf24; }

    .sound-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    /* Main Container */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-title {
      font-size: 2rem;
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(135deg, #fbbf24, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* The Mascot / Character Display */
    .mascot-area {
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1), transparent 70%);
      border-radius: 50%;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .mascot-image {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 4px solid #10b981;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
      transition: all 0.3s ease;
    }

    .mascot-image img {
      width: 140%;
      height: 140%;
      object-fit: cover;
      transform: translateY(8%);
    }

    .mascot-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #fbbf24;
      margin-top: 12px;
    }

    .mascot-power {
      font-size: 0.8rem;
      color: #94a3b8;
      font-style: italic;
    }

    /* The Meter Card */
    .meter-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px;
      padding: 24px;
      margin-bottom: 24px;
    }

    /* Volume Meter */
    .volume-meter {
      margin-bottom: 24px;
    }

    .meter-bar-container {
      width: 100%;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 12px;
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* State Message */
    .state-message {
      text-align: center;
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-weight: 800;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    .state-quiet { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .state-warning { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .state-loud { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); animation: pulse-red 1s infinite; }
    .state-reward { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); animation: pulse-gold 0.5s ease-out; }

    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes pulse-gold { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

    /* Timer Section */
    .timer-section {
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .timer-display {
      font-family: 'Courier New', monospace;
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
      color: #fbbf24;
      letter-spacing: 4px;
    }

    .timer-progress {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0;
    }

    .timer-progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #fbbf24);
      transition: width 0.3s linear;
    }

    .timer-label {
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Control Buttons */
    .control-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
    .btn-primary:active { transform: translateY(1px); }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    /* Character Grid (Next Unlocks) */
    .next-unlocks {
      margin-top: 30px;
      text-align: center;
    }

    .next-title {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .character-strip {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .next-character {
      text-align: center;
      opacity: 0.5;
      transition: all 0.3s;
    }

    .next-character.soon {
      opacity: 0.8;
    }

    .next-character.active {
      opacity: 1;
      transform: scale(1.05);
    }

    .next-avatar {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .next-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .next-name {
      font-size: 0.65rem;
      font-weight: 600;
    }

    .next-points {
      font-size: 0.55rem;
      color: #fbbf24;
    }

    /* Footer Branding */
    .footer-brand {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer-brand a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer-brand a:hover {
      color: #fbbf24;
    }

    .footer-small {
      font-size: 0.7rem;
      color: #475569;
      margin-top: 8px;
    }

    /* Status Badge */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .mascot-image { width: 140px; height: 140px; }
      .timer-display { font-size: 2rem; }
      .hero-title { font-size: 1.5rem; }
      .btn { padding: 10px 18px; font-size: 0.8rem; }
    }

    /* Permission prompt */
    .permission-prompt {
      text-align: center;
      padding: 40px;
    }

    .permission-prompt i {
      font-size: 4rem;
      color: #fbbf24;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="calm-header">
  <div class="logo-area">
    <div class="logo-icon"><i class="fas fa-leaf"></i></div>
    <div class="logo-text"><span>Calm</span><span>Meter</span></div>
  </div>
  <div class="points-badge">
    <i class="fas fa-star"></i>
    <span class="points-value" id="totalPointsDisplay">0</span>
    <span style="font-size: 0.7rem;">PTS</span>
  </div>
  <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()">
    <i class="fas fa-volume-up"></i>
  </button>
</div>

<div class="container">
  <div class="hero-section">
    <div class="hero-title">Classroom Calm Meter</div>
    <div class="hero-subtitle">Keep it quiet, earn points, unlock characters!</div>
  </div>

  <div class="mascot-area">
    <div class="mascot-image" id="mascotImage">
      <img id="currentCharacterImg" src="https://trackedu.github.io/common-assets/1b.png" alt="Character">
    </div>
    <div class="mascot-name" id="currentCharacterName">Curious Explorer</div>
    <div class="mascot-power" id="currentCharacterPower">INQUIRER: Nurtures curiosity.</div>
  </div>

  <div class="meter-card">
    <div class="volume-meter">
      <div class="meter-bar-container">
        <div class="meter-fill" id="volumeFill"></div>
      </div>
      <div class="meter-labels">
        <span>🌱 Quiet</span>
        <span>⚠️ Getting loud</span>
        <span>🔴 Too loud</span>
      </div>
    </div>

    <div class="state-message" id="stateMessage">
      <i class="fas fa-microphone-alt"></i> Ready to start
    </div>

    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-progress">
        <div class="timer-progress-fill" id="timerProgress"></div>
      </div>
      <div class="timer-label" id="timerLabel">Goal: 3 minutes of calm</div>
    </div>

    <div class="control-buttons">
      <button class="btn btn-primary" id="startBtn" onclick="startMeter()">
        <i class="fas fa-play"></i> Start
      </button>
      <button class="btn btn-secondary" id="stopBtn" onclick="stopMeter()" style="display: none;">
        <i class="fas fa-stop"></i> Stop
      </button>
      <button class="btn btn-secondary" onclick="resetPoints()">
        <i class="fas fa-undo-alt"></i> Reset Points
      </button>
    </div>
  </div>

  <div class="next-unlocks">
    <div class="next-title">✦ NEXT UNLOCKS ✦</div>
    <div class="character-strip" id="nextUnlocksStrip">
      <!-- Dynamic -->
    </div>
  </div>

  <div class="footer-brand">
    <a href="https://trackedu.net" target="_blank">
      <i class="fas fa-heart" style="color: #fbbf24;"></i> Made with love by TrackEDU
    </a>
    <div class="footer-small">Explore 12+ free classroom tools →</div>
  </div>
</div>

<script>
  // ==========================================
  // CALM METER - STANDALONE VERSION
  // No login required - localStorage persistence
  // Auto-awards points for staying quiet
  // Unlocks 30 characters at point milestones
  // ==========================================

  // --- CHARACTER DATA (30 evolutions) ---
  const CHARACTERS = [
    { url: "https://trackedu.github.io/common-assets/1b.png", name: "Curious Explorer", power: "INQUIRER: Nurtures curiosity.", threshold: 0 },
    { url: "https://trackedu.github.io/common-assets/1.png", name: "Eager Investigator", power: "INQUIRER: Shows independence.", threshold: 50 },
    { url: "https://trackedu.github.io/common-assets/2.png", name: "Lifelong Inquirer", power: "INQUIRER: Love of learning.", threshold: 100 },
    { url: "https://trackedu.github.io/common-assets/3.png", name: "Knowledge Seeker", power: "KNOWLEDGEABLE: Explores concepts.", threshold: 150 },
    { url: "https://trackedu.github.io/common-assets/5.png", name: "Global Learner", power: "KNOWLEDGEABLE: Deep knowledge.", threshold: 200 },
    { url: "https://trackedu.github.io/common-assets/6.png", name: "Wisdom Keeper", power: "KNOWLEDGEABLE: Global significance.", threshold: 250 },
    { url: "https://trackedu.github.io/common-assets/7.png", name: "Creative Thinker", power: "THINKER: Critical thinking.", threshold: 300 },
    { url: "https://trackedu.github.io/common-assets/8.png", name: "Problem Solver", power: "THINKER: Innovative solutions.", threshold: 350 },
    { url: "https://trackedu.github.io/common-assets/9.png", name: "Reasoned Analyst", power: "THINKER: Ethical decisions.", threshold: 400 },
    { url: "https://trackedu.github.io/common-assets/10.png", name: "Clear Communicator", power: "COMMUNICATOR: Expresses ideas.", threshold: 450 },
    { url: "https://trackedu.github.io/common-assets/11.png", name: "Active Listener", power: "COMMUNICATOR: Collaborates.", threshold: 500 },
    { url: "https://trackedu.github.io/common-assets/12.png", name: "Voice of Unity", power: "COMMUNICATOR: Brings together.", threshold: 550 },
    { url: "https://trackedu.github.io/common-assets/13.png", name: "Honest Ally", power: "PRINCIPLED: Integrity.", threshold: 600 },
    { url: "https://trackedu.github.io/common-assets/14.png", name: "Fairness Champion", power: "PRINCIPLED: Respects rights.", threshold: 650 },
    { url: "https://trackedu.github.io/common-assets/15.png", name: "Principled Leader", power: "PRINCIPLED: Responsibility.", threshold: 700 },
    { url: "https://trackedu.github.io/common-assets/16.png", name: "Open Mind", power: "OPEN-MINDED: Appreciates culture.", threshold: 750 },
    { url: "https://trackedu.github.io/common-assets/17.png", name: "Perspective Seeker", power: "OPEN-MINDED: Evaluates views.", threshold: 800 },
    { url: "https://trackedu.github.io/common-assets/18.png", name: "Global Citizen", power: "OPEN-MINDED: Embraces diversity.", threshold: 850 },
    { url: "https://trackedu.github.io/common-assets/19.png", name: "Caring Peer", power: "CARING: Empathy.", threshold: 900 },
    { url: "https://trackedu.github.io/common-assets/20.png", name: "Community Helper", power: "CARING: Service commitment.", threshold: 950 },
    { url: "https://trackedu.github.io/common-assets/21.png", name: "Compassionate Heart", power: "CARING: Makes difference.", threshold: 1000 },
    { url: "https://trackedu.github.io/common-assets/22.png", name: "Brave Pioneer", power: "COURAGEOUS: Faces uncertainty.", threshold: 1100 },
    { url: "https://trackedu.github.io/common-assets/23.png", name: "Resilient Spirit", power: "COURAGEOUS: Explores ideas.", threshold: 1200 },
    { url: "https://trackedu.github.io/common-assets/24.png", name: "Fearless Innovator", power: "COURAGEOUS: Resilient.", threshold: 1300 },
    { url: "https://trackedu.github.io/common-assets/25.png", name: "Balanced Scholar", power: "BALANCED: Well-being.", threshold: 1400 },
    { url: "https://trackedu.github.io/common-assets/29.png", name: "Well-rounded Peer", power: "BALANCED: Interdependence.", threshold: 1500 },
    { url: "https://trackedu.github.io/common-assets/26.png", name: "Harmony Builder", power: "BALANCED: Recognizes.", threshold: 1600 },
    { url: "https://trackedu.github.io/common-assets/27.png", name: "Reflective Thinker", power: "REFLECTIVE: Considers.", threshold: 1700 },
    { url: "https://trackedu.github.io/common-assets/28.png", name: "Mindful Mentor", power: "REFLECTIVE: Understands.", threshold: 1800 },
    { url: "https://trackedu.github.io/common-assets/30.png", name: "Global Luminary", power: "ULTIMATE: Role model.", threshold: 2000 }
  ];

  // Audio state
  let soundEnabled = true;
  let audioContext = null;
  let mediaStream = null;
  let sourceNode = null;
  let analyserNode = null;
  let animationId = null;
  let isMonitoring = false;

  // Timer state
  let timerInterval = null;
  let timerSeconds = 180; // 3 minutes default
  let totalTargetSeconds = 180;
  let currentCalmSeconds = 0;
  let isInNoiseZone = false;
  let streakAwarded = false;

  // Points state (persisted in localStorage)
  let totalPoints = 0;
  let currentCharacterIndex = 0;

  // Current volume
  let currentVolumePercent = 0;

  // DOM elements
  const volumeFill = document.getElementById('volumeFill');
  const stateMessageDiv = document.getElementById('stateMessage');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerProgress = document.getElementById('timerProgress');
  const timerLabel = document.getElementById('timerLabel');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const totalPointsDisplay = document.getElementById('totalPointsDisplay');
  const currentCharacterImg = document.getElementById('currentCharacterImg');
  const currentCharacterName = document.getElementById('currentCharacterName');
  const currentCharacterPower = document.getElementById('currentCharacterPower');

  // ==========================================
  // LOCALSTORAGE PERSISTENCE
  // ==========================================
  function loadPoints() {
    const saved = localStorage.getItem('calmmeter_points');
    if (saved !== null) {
      totalPoints = parseInt(saved);
    } else {
      totalPoints = 0;
    }
    updatePointsDisplay();
    updateCharacterByPoints();
    updateNextUnlocks();
  }

  function savePoints() {
    localStorage.setItem('calmmeter_points', totalPoints);
    updatePointsDisplay();
    updateCharacterByPoints();
    updateNextUnlocks();
  }

  function resetPoints() {
    if (confirm('Reset all points? This will reset your character progress too.')) {
      totalPoints = 0;
      savePoints();
      showToast('Points reset to 0!', 'info');
      playPopSound();
    }
  }

  function addPoints(amount) {
    totalPoints += amount;
    savePoints();
    
    // Check for character unlock
    const newCharIndex = getCharacterIndexForPoints(totalPoints);
    if (newCharIndex > currentCharacterIndex) {
      // New character unlocked!
      currentCharacterIndex = newCharIndex;
      updateCharacterByPoints();
      playFanfareSound();
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
      showToast(`🎉 NEW CHARACTER UNLOCKED: ${CHARACTERS[currentCharacterIndex].name}!`, 'success');
    }
  }

  function getCharacterIndexForPoints(points) {
    let idx = 0;
    for (let i = CHARACTERS.length - 1; i >= 0; i--) {
      if (points >= CHARACTERS[i].threshold) {
        idx = i;
        break;
      }
    }
    return idx;
  }

  function updateCharacterByPoints() {
    const idx = getCharacterIndexForPoints(totalPoints);
    currentCharacterIndex = idx;
    const char = CHARACTERS[idx];
    currentCharacterImg.src = char.url;
    currentCharacterName.textContent = char.name;
    currentCharacterPower.textContent = char.power;
  }

  function updatePointsDisplay() {
    totalPointsDisplay.textContent = totalPoints.toLocaleString();
  }

  function updateNextUnlocks() {
    const container = document.getElementById('nextUnlocksStrip');
    const currentIdx = getCharacterIndexForPoints(totalPoints);
    const nextChars = CHARACTERS.slice(currentIdx + 1, currentIdx + 4);
    
    if (nextChars.length === 0) {
      container.innerHTML = '<div style="color: #fbbf24;">🏆 MAX LEVEL REACHED! 🏆</div>';
      return;
    }
    
    container.innerHTML = nextChars.map((c, i) => `
      <div class="next-character soon">
        <div class="next-avatar"><img src="${c.url}" alt="${c.name}"></div>
        <div class="next-name">${c.name}</div>
        <div class="next-points">${c.threshold} pts</div>
      </div>
    `).join('');
  }

  // ==========================================
  // TIMER FUNCTIONS
  // ==========================================
  function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    
    const percent = (timerSeconds / totalTargetSeconds) * 100;
    timerProgress.style.width = `${Math.max(0, percent)}%`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isMonitoring) return;
      
      // Only count down if not in noise zone
      if (!isInNoiseZone && timerSeconds > 0 && !streakAwarded) {
        timerSeconds--;
        currentCalmSeconds++;
        updateTimerDisplay();
        
        // Award points automatically for staying calm!
        // Every 10 seconds of calm = 1 point
        if (currentCalmSeconds >= 10 && !streakAwarded) {
          const pointsToAdd = Math.floor(currentCalmSeconds / 10);
          addPoints(pointsToAdd);
          currentCalmSeconds = currentCalmSeconds % 10;
          
          // Show floating +1 animation
          showFloatingPoints(pointsToAdd);
          playTickSound();
        }
        
        if (timerSeconds <= 0 && !streakAwarded) {
          // Goal reached!
          streakAwarded = true;
          const bonusPoints = 5;
          addPoints(bonusPoints);
          showToast(`🎯 Goal reached! +${bonusPoints} bonus points!`, 'success');
          playFanfareSound();
          confetti({ particleCount: 300, spread: 120, origin: { y: 0.5 } });
          stateMessageDiv.innerHTML = '<i class="fas fa-trophy"></i> GOAL ACHIEVED! Amazing calm!';
          stateMessageDiv.classList.add('state-reward');
          setTimeout(() => {
            if (stateMessageDiv) stateMessageDiv.classList.remove('state-reward');
          }, 3000);
        }
      }
    }, 1000);
  }

  function resetTimer() {
    timerSeconds = totalTargetSeconds;
    currentCalmSeconds = 0;
    streakAwarded = false;
    updateTimerDisplay();
    timerProgress.style.width = '100%';
  }

  // ==========================================
  // VOLUME METER & AUDIO
  // ==========================================
  async function initAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('This browser does not support microphone access.', 'error');
      return false;
    }
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      mediaStream = stream;
      
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 256;
      analyserNode.smoothingTimeConstant = 0.7;
      
      sourceNode = audioContext.createMediaStreamSource(stream);
      sourceNode.connect(analyserNode);
      
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      
      return true;
    } catch (error) {
      console.error('Microphone error:', error);
      if (error.name === 'NotAllowedError') {
        showToast('Please allow microphone access to use the Calm Meter.', 'error');
      } else {
        showToast('Could not access microphone. Please check permissions.', 'error');
      }
      return false;
    }
  }

  function startVolumeLoop() {
    if (!isMonitoring || !analyserNode) return;
    
    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
    
    function updateVolume() {
      if (!isMonitoring || !analyserNode) return;
      
      analyserNode.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      let avg = sum / dataArray.length;
      let percent = Math.min(100, Math.round((avg / 255) * 100));
      
      // Apply sensitivity curve
      percent = Math.round(Math.pow(percent / 100, 0.7) * 100);
      currentVolumePercent = percent;
      
      // Update UI
      volumeFill.style.width = `${percent}%`;
      
      // Set color based on level
      if (percent < 30) {
        volumeFill.style.background = '#10b981';
        stateMessageDiv.innerHTML = '<i class="fas fa-check-circle"></i> Quiet zone! Keep it up!';
        stateMessageDiv.className = 'state-message state-quiet';
        isInNoiseZone = false;
      } else if (percent < 65) {
        volumeFill.style.background = '#f59e0b';
        stateMessageDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Getting loud! Bring voices down.';
        stateMessageDiv.className = 'state-message state-warning';
        isInNoiseZone = true;
      } else {
        volumeFill.style.background = '#ef4444';
        stateMessageDiv.innerHTML = '<i class="fas fa-microphone-alt"></i> Too loud! Let\'s reset our voices.';
        stateMessageDiv.className = 'state-message state-loud';
        isInNoiseZone = true;
      }
      
      animationId = requestAnimationFrame(updateVolume);
    }
    
    updateVolume();
  }

  function stopVolumeLoop() {
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    volumeFill.style.width = '0%';
    stateMessageDiv.innerHTML = '<i class="fas fa-microphone-alt"></i> Ready to start';
    stateMessageDiv.className = 'state-message';
  }

  async function startMeter() {
    const audioReady = await initAudio();
    if (!audioReady) return;
    
    isMonitoring = true;
    startVolumeLoop();
    startTimer();
    
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-flex';
    
    showToast('Calm Meter started! Stay quiet to earn points.', 'success');
  }

  function stopMeter() {
    isMonitoring = false;
    stopVolumeLoop();
    
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    
    startBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    
    stateMessageDiv.innerHTML = '<i class="fas fa-pause-circle"></i> Stopped. Click Start to resume.';
    stateMessageDiv.className = 'state-message';
    
    showToast('Calm Meter stopped.', 'info');
  }

  // ==========================================
  // UI HELPERS
  // ==========================================
  function showToast(message, type = 'info') {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      container.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none;';
      document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    const bgColor = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#3b82f6');
    toast.style.cssText = `background: ${bgColor}; color: white; padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); pointer-events: auto;`;
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function showFloatingPoints(points) {
    const floatEl = document.createElement('div');
    floatEl.textContent = `+${points}`;
    floatEl.style.cssText = `
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px #fbbf24;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 1.5s ease-out forwards;
      font-family: 'Fredoka One', cursive;
    `;
    document.body.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 1500);
  }

  // Add keyframe animation
  const style = document.createElement('style');
  style.textContent = `
    @keyframes floatUp {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      50% { transform: translate(-50%, -70%) scale(1.2); }
      100% { transform: translate(-50%, -120%) scale(1); opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  // Sound effects (simple)
  function playTickSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
      osc.stop(ctx.currentTime + 0.1);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
  }

  function playPopSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 523.25;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
      osc.stop(ctx.currentTime + 0.15);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
  }

  function playFanfareSound() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + (i * 0.12));
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        osc.stop(ctx.currentTime + 0.5);
      });
      setTimeout(() => ctx.close(), 800);
    } catch(e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggleBtn');
    if (btn) {
      btn.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
    }
  }

  // ==========================================
  // INITIALIZATION
  // ==========================================
  function init() {
    loadPoints();
    updateNextUnlocks();
    
    // Set default timer
    totalTargetSeconds = 180;
    timerSeconds = 180;
    updateTimerDisplay();
    
    // Add resize listener for responsiveness
    window.addEventListener('resize', () => {});
  }
  
  init();
  
  // Expose functions globally
  window.startMeter = startMeter;
  window.stopMeter = stopMeter;
  window.resetPoints = resetPoints;
  window.toggleSound = toggleSound;
</script>
</body>
